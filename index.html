<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索宇宙帖子</title>
    
    <style>
        :root {
            --bg: #000000;
            --surface: rgba(8, 12, 22, 0.82);
            --surface-hover: rgba(14, 22, 40, 0.92);
            --text-primary: #d0e8ff;
            --text-secondary: #6080a0;
            --text-muted: #3a5068;
            --accent: #00d4ff;
            --accent-hover: #00eaff;
            --border: rgba(0, 212, 255, 0.12);
            --border-focus: rgba(0, 212, 255, 0.4);
            --danger: #ff4466;
            --gold: #00d4ff;
            --gold-hover: #00eaff;
            --neon-blue: #00d4ff;
            --neon-cyan: #00ffea;
            --neon-purple: #a040ff;
            --glow-blue: rgba(0, 212, 255, 0.5);
            --glow-cyan: rgba(0, 255, 234, 0.4);
            --card-shadow: 0 2px 16px rgba(0, 0, 0, 0.5), 0 0 1px rgba(0, 212, 255, 0.08);
            --card-glow: 0 0 28px rgba(0, 212, 255, 0.12), 0 8px 32px rgba(0, 0, 0, 0.6);
            --glass-blur: blur(20px);
            --glass-blur-sm: blur(12px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Exo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.imglt.com/20260803/0994543291ec65795e5eadac3a134b6f.jpg') center/cover no-repeat;
            z-index: 0;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        .header {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px 20px 30px;
        }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-family: 'Audiowide', sans-serif;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3), 0 0 60px rgba(0, 212, 255, 0.1);
}
        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 180px;
            max-width: 400px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s;
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.08), 0 0 16px rgba(255, 215, 0, 0.1);
        }
        .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.6;
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            display: none;
        }
        .search-clear:hover {
            color: var(--text-primary);
        }
        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
                    }
        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            letter-spacing: 0.01em;
        }
        .tab:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }
        .tab.active {
            background: rgba(0, 212, 255, 0.12);
            color: var(--accent);
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.1), inset 0 0 12px rgba(0, 212, 255, 0.05);
        }
        .tab .icon {
            margin-right: 6px;
        }
        .fab-post {
            padding: 12px 28px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fab-post:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3), 0 0 16px rgba(255, 215, 0, 0.15);
        }
        .fab-post:active {
            transform: translateY(0);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.25s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal {
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 32px 32px;
            width: 90%;
            max-width: 480px;
            position: relative;
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 1px rgba(0, 212, 255, 0.15);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .modal-close:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }
        .modal-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 28px;
            color: var(--text-primary);
            font-family: 'Michroma', sans-serif;
    letter-spacing: 2px;
}
        .modal-input {
            width: 100%;
            padding: 14px 18px;
            background: #22222e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s;
            margin-bottom: 16px;
        }
        .modal-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1), 0 0 16px rgba(0, 212, 255, 0.06);
        }
        .modal-input::placeholder {
            color: var(--text-muted);
        }
        .modal-textarea {
            width: 100%;
            min-height: 140px;
            padding: 14px 18px;
            background: #22222e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            resize: vertical;
            transition: all 0.25s;
            line-height: 1.6;
        }
        .modal-textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1), 0 0 16px rgba(0, 212, 255, 0.06);
        }
        .modal-textarea::placeholder {
            color: var(--text-muted);
        }
        .modal-submit {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            margin-top: 20px;
        }
        .modal-submit:hover {
            background: var(--gold-hover);
            box-shadow: 0 6px 28px rgba(255, 215, 0, 0.28), 0 0 12px rgba(255, 215, 0, 0.12);
            transform: translateY(-1px);
        }
        .modal-submit:active {
            transform: scale(0.98);
        }
        .modal-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.4s ease both;
            box-shadow: var(--card-shadow);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
            transform: translateY(-2px);
            box-shadow: var(--card-glow);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 10px;
        }
        .post-header .post-author {
            transition: transform 0.2s ease;
        }
        .post-header .post-author:hover {
            transform: translateX(2px);
        }
        .post-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(160, 64, 255, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            border: 1.5px solid rgba(0, 212, 255, 0.25);
            overflow: hidden;
            flex-shrink: 0;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .avatar:hover {
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.25);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .author-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }
        .post-time {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .post-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
            font-family: 'Audiowide', sans-serif;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
}
        .post-content {
            color: rgba(240, 240, 245, 0.88);
            line-height: 1.8;
            font-size: 0.95rem;
            margin-bottom: 18px;
            white-space: pre-wrap;
            word-break: break-word;
            font-weight: 400;
            letter-spacing: 0.01em;
        }
        .post-source {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 14px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }
        .source-label {
            color: var(--text-muted);
            white-space: nowrap;
        }
        .source-link {
            color: #4fc3f7;
            text-decoration: none;
            word-break: break-all;
            transition: color 0.2s;
        }
        .source-link:hover {
            color: #81d4fa;
            text-decoration: underline;
        }
        .pin-btn {
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: rgba(255, 215, 0, 0.8);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
            margin-right: 4px;
        }
        .post-card:hover .pin-btn {
            opacity: 1;
        }
        .pin-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.6);
            color: #ffd700;
        }
        .post-card:has(.pinned) {
            border-color: rgba(255, 215, 0, 0.3);
        }
        /* 登录区域 */
        .auth-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
        }
        .auth-user {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-primary);
                    }
        .auth-avatar-small {
            width: 24px; height: 24px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }
        .auth-name {
            font-weight: 500; max-width: 120px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .btn-logout {
            padding: 4px 10px; background: transparent; border: none;
            color: var(--text-muted); font-size: 0.75rem;
            cursor: pointer; font-family: inherit;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .btn-logout:hover { color: var(--danger); text-shadow: 0 0 8px rgba(255, 68, 102, 0.4); }
        .btn-auth {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s;
                    }
        .btn-auth:hover {
            color: var(--text-primary);
            border-color: var(--border-focus);
            background: rgba(0, 212, 255, 0.06);
            box-shadow: 0 0 14px rgba(0, 212, 255, 0.12);
        }
        /* 登录弹窗 */
        .auth-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 150;
            display: none; align-items: center; justify-content: center;
        }
        .auth-modal-overlay.show { display: flex; }
        .auth-modal {
            background: #0f0f0f; border-radius: 20px;
            padding: 36px; width: 90%; max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }
        .auth-modal h2 {
            font-size: 1.3rem; margin-bottom: 24px;
            text-align: center; color: var(--text-primary);
        }
        .auth-field { margin-bottom: 16px; }
        .auth-field label {
            display: block; font-size: 0.82rem;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .auth-field input {
            width: 100%; padding: 12px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem; font-family: inherit; outline: none;
        }
        .auth-field input:focus { border-color: var(--border-focus); }
        .auth-field input::placeholder { color: var(--text-muted); }
        .auth-submit {
            width: 100%; padding: 12px;
            background: #ffffff; color: #000000;
            border: none; border-radius: 12px;
            font-size: 0.92rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s; margin-top: 8px;
        }
        .auth-submit:hover { background: #e0e0e0; }
        .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-switch {
            text-align: center; margin-top: 16px;
            font-size: 0.82rem; color: var(--text-muted);
        }
        .auth-switch a {
            color: var(--gold); cursor: pointer; text-decoration: none;
        }
        .auth-switch a:hover { text-decoration: underline; }
        .auth-error {
            background: rgba(255,85,85,0.1);
            border: 1px solid rgba(255,85,85,0.2);
            border-radius: 10px; padding: 10px 14px;
            color: #ff8888; font-size: 0.82rem;
            margin-bottom: 16px; display: none;
        }
        .auth-error.show { display: block; }
        .auth-success {
            background: rgba(100,255,100,0.1);
            border: 1px solid rgba(100,255,100,0.2);
            border-radius: 10px; padding: 10px 14px;
            color: #88ff88; font-size: 0.82rem;
            margin-bottom: 16px; display: none;
        }
        .auth-success.show { display: block; }
        .auth-close {
            position: absolute; top: 12px; right: 16px;
            background: transparent; border: none;
            color: var(--text-muted); font-size: 1.2rem; cursor: pointer;
        }
        /* 图片上传 */
        .image-input-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
        }
        .image-input {
            flex: 1; padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.88rem; font-family: inherit; outline: none;
        }
        .image-input:focus { border-color: var(--border-focus); }
        .image-input::placeholder { color: var(--text-muted); }
        .post-images {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
            border-radius: 12px;
            overflow: hidden;
        }
        .post-image {
            max-width: 100%; max-height: 300px;
            border-radius: 12px; border: 1px solid var(--border);
            object-fit: cover;
        }
        /* 分享按钮 */
        /* 烟花 */
        @media (max-width: 600px) {
            .pin-btn {
                opacity: 1;
            }
        }
        .delete-btn {
            background: transparent;
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: rgba(255, 120, 120, 0.7);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .post-card:hover .delete-btn {
            opacity: 1;
        }
        .delete-btn:hover {
            background: rgba(255, 80, 80, 0.15);
            border-color: rgba(255, 100, 100, 0.6);
            color: rgba(255, 150, 150, 1);
            box-shadow: 0 0 12px rgba(255, 80, 80, 0.15);
        }

/* ============================================================

   ============================================================ */

/* 通知铃铛按钮 - 与 

.notify-btn {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 50%;

    height: 36px;
    cursor: pointer;
    position: relative;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.notify-btn:hover {
    background: var(--bg-secondary);
    border-color: var(--accent-color);
}

/* 红色未读徽章 */
.notify-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: linear-gradient(135deg, #ff4466, #ff6b6b);
    color: white;
    font-size: 0.65rem;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;

    align-items: center;
    justify-content: center;

    animation: badgePulse 2s infinite ease-in-out;
}
@keyframes badgePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
}

/* 通知弹窗遮罩 - 与 .profile-modal-overlay 一致 */
.notification-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    align-items: center;

    z-index: 1000;

.video-embed {

    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 3px,
        rgba(0, 212, 255, 0.02) 3px,
        rgba(0, 212, 255, 0.02) 4px
    );
    pointer-events: none;
    z-index: 99998;
    animation: scanlineMove 8s linear infinite;
}
@keyframes scanlineMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
}

/* --- 全息网格背景 --- */
.bg-overlay {
    background: rgba(0, 5, 15, 0.55) !important;
    background-image:
        linear-gradient(rgba(0, 212, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.025) 1px, transparent 1px) !important;
    background-size: 50px 50px !important;
}

/* --- 标题霓虹发光 --- */
.header h1 {
    text-shadow:
        0 0 10px rgba(0, 212, 255, 0.6),
        0 0 20px rgba(0, 212, 255, 0.4),
        0 0 40px rgba(0, 212, 255, 0.2) !important;
    letter-spacing: 3px !important;
}
.header p {
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.3) !important;
    letter-spacing: 1px !important;
}

/* --- 帖子卡片全息效果 --- */
.post-card {
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: 16px !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    box-shadow:
        0 0 0 1px rgba(0, 212, 255, 0.05),
        0 4px 24px rgba(0, 0, 0, 0.4) !important;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
    position: relative !important;
    overflow: hidden;
}
.post-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.6), transparent);
    opacity: 0;
    transition: opacity 0.35s;
}
.post-card:hover {
    background: var(--surface-hover) !important;
    border-color: rgba(0, 212, 255, 0.35) !important;
    box-shadow:
        0 0 0 1px rgba(0, 212, 255, 0.15),
        0 0 24px rgba(0, 212, 255, 0.15),
        0 8px 32px rgba(0, 0, 0, 0.5) !important;
    transform: translateY(-2px) !important;
}
.post-card:hover::before {
    opacity: 1;
}

/* --- 置顶帖特殊发光 --- */
.post-card:has(.pinned) {
    border-color: rgba(255, 215, 0, 0.3) !important;
    box-shadow:
        0 0 0 1px rgba(255, 215, 0, 0.1),
        0 0 20px rgba(255, 215, 0, 0.08),
        0 4px 24px rgba(0, 0, 0, 0.4) !important;
}

/* --- 搜索框科幻样式 --- */
.search-box input {
    background: rgba(8, 12, 22, 0.8) !important;
    border: 1px solid rgba(0, 212, 255, 0.15) !important;
    border-radius: 12px !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
    transition: all 0.3s !important;
}
.search-box input:focus {
    border-color: var(--neon-blue) !important;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.2) !important;
}
.search-box .search-icon {
    color: var(--neon-blue) !important;
    text-shadow: 0 0 6px rgba(0, 212, 255, 0.5) !important;
}

/* --- 标签栏科幻样式 --- */
.tabs {
    background: rgba(8, 12, 22, 0.8) !important;
    border: 1px solid rgba(0, 212, 255, 0.12) !important;
    border-radius: 12px !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
}
.tab {
    border-radius: 8px !important;
    transition: all 0.3s !important;
}
.tab:hover {
    color: var(--neon-blue) !important;
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.4) !important;
}
.tab.active {
    background: rgba(0, 212, 255, 0.12) !important;
    color: var(--neon-cyan) !important;
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.5) !important;
    box-shadow: 0 0 12px rgba(0, 212, 255, 0.1) !important;
}

/* --- 发布按钮科幻样式 --- */
.fab-post {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.9), rgba(0, 150, 255, 0.9)) !important;
    color: #000714 !important;
    border-radius: 12px !important;
    text-shadow: 0 0 4px rgba(255, 255, 255, 0.3) !important;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.3) !important;
    transition: all 0.3s !important;
}
.fab-post:hover {
    background: linear-gradient(135deg, rgba(0, 234, 255, 1), rgba(0, 170, 255, 1)) !important;
    box-shadow: 0 0 28px rgba(0, 212, 255, 0.5) !important;
    transform: translateY(-2px) !important;
}

/* --- 模态框科幻样式 --- */
.modal-overlay {
    background: rgba(0, 2, 8, 0.75) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
}
.modal {
    background: rgba(6, 10, 20, 0.95) !important;
    border: 1px solid rgba(0, 212, 255, 0.2) !important;
    border-radius: 20px !important;
    box-shadow:
        0 0 0 1px rgba(0, 212, 255, 0.08),
        0 0 40px rgba(0, 212, 255, 0.1),
        0 20px 60px rgba(0, 0, 0, 0.6) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
}
.modal::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.6), transparent);
}
.modal-title {
    text-shadow: 0 0 12px rgba(0, 212, 255, 0.4) !important;
}
.modal-input {
    background: rgba(0, 5, 15, 0.6) !important;
    border: 1px solid rgba(0, 212, 255, 0.12) !important;
    border-radius: 12px !important;
    transition: all 0.3s !important;
}
.modal-input:focus {
    border-color: var(--neon-blue) !important;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.15) !important;
}
.modal-input::placeholder {
    color: rgba(96, 128, 160, 0.5) !important;
}
.modal-submit {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.9), rgba(0, 150, 255, 0.9)) !important;
    color: #000714 !important;
    border-radius: 12px !important;
    font-weight: 700 !important;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.25) !important;
    transition: all 0.3s !important;
}
.modal-submit:hover {
    box-shadow: 0 0 28px rgba(0, 212, 255, 0.45) !important;
    transform: translateY(-1px) !important;
}

/* --- 头像发光环 --- */
.avatar {
    border: 1px solid rgba(0, 212, 255, 0.2) !important;
    box-shadow: 0 0 8px rgba(0, 212, 255, 0.1) !important;
    transition: all 0.3s !important;
}
.avatar:hover {
    border-color: rgba(0, 212, 255, 0.5) !important;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.3) !important;
}

/* --- 作者名发光 --- */
.author-name {
    text-shadow: 0 0 6px rgba(0, 212, 255, 0.15) !important;
}

/* --- 评论区域科幻样式 --- */
.comment-item {
    border-left: 2px solid rgba(0, 212, 255, 0.15) !important;
    transition: all 0.3s !important;
}
.comment-item:hover {
    border-left-color: rgba(0, 212, 255, 0.4) !important;
    background: rgba(0, 212, 255, 0.02) !important;
}
.comment-submit {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.85), rgba(0, 150, 255, 0.85)) !important;
    color: #000714 !important;
    border-radius: 10px !important;
    box-shadow: 0 0 12px rgba(0, 212, 255, 0.2) !important;
    transition: all 0.3s !important;
}
.comment-submit:hover {
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.4) !important;
}

/* --- 火箭发射卡片科幻样式 --- */
.launch-card {
    background: rgba(8, 12, 22, 0.82) !important;
    border: 1px solid rgba(0, 212, 255, 0.12) !important;
    border-radius: 16px !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4) !important;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
    position: relative;
    overflow: hidden;
}
.launch-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.5), transparent);
    opacity: 0;
    transition: opacity 0.35s;
}
.launch-card:hover {
    border-color: rgba(0, 212, 255, 0.35) !important;
    box-shadow:
        0 0 0 1px rgba(0, 212, 255, 0.12),
        0 0 24px rgba(0, 212, 255, 0.12),
        0 8px 32px rgba(0, 0, 0, 0.5) !important;
    transform: translateY(-2px) !important;
}
.launch-card:hover::before {
    opacity: 1;
}
.launch-card.launching-soon {
    border-color: rgba(0, 255, 234, 0.25) !important;
    box-shadow: 0 0 12px rgba(0, 255, 234, 0.08) !important;
}

/* --- 通知项科幻样式 --- */
.notification-item {
    background: rgba(8, 12, 22, 0.8) !important;
    border: 1px solid rgba(0, 212, 255, 0.1) !important;
    border-radius: 12px !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
    transition: all 0.3s !important;
}
.notification-item:hover {
    border-color: rgba(0, 212, 255, 0.3) !important;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.1) !important;
}
.notification-item.unread {
    border-left: 3px solid var(--neon-blue) !important;
    box-shadow: -2px 0 12px rgba(0, 212, 255, 0.1) !important;
}

/* --- 认证按钮科幻样式 --- */
.btn-auth {
    background: rgba(8, 12, 22, 0.8) !important;
    border: 1px solid rgba(0, 212, 255, 0.2) !important;
    border-radius: 12px !important;
    color: var(--neon-blue) !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
    transition: all 0.3s !important;
}
.btn-auth:hover {
    background: rgba(0, 212, 255, 0.1) !important;
    border-color: rgba(0, 212, 255, 0.5) !important;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.2) !important;
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.5) !important;
}
.auth-submit {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.9), rgba(0, 150, 255, 0.9)) !important;
    color: #000714 !important;
    border-radius: 12px !important;
    font-weight: 700 !important;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.2) !important;
    transition: all 0.3s !important;
}
.auth-submit:hover {
    box-shadow: 0 0 28px rgba(0, 212, 255, 0.45) !important;
    transform: translateY(-1px) !important;
}

/* --- 自定义滚动条 --- */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}
::-webkit-scrollbar-track {
    background: rgba(0, 5, 15, 0.5);
}
::-webkit-scrollbar-thumb {
    background: rgba(0, 212, 255, 0.3);
    border-radius: 4px;
    box-shadow: 0 0 4px rgba(0, 212, 255, 0.2);
}
::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 212, 255, 0.5);
    box-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
}

/* --- 文字选中颜色 --- */
::selection {
    background: rgba(0, 212, 255, 0.3);
    color: #ffffff;
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
}

/* --- 链接科幻样式 --- */
a {
    color: var(--neon-blue);
    text-shadow: 0 0 4px rgba(0, 212, 255, 0.2);
    transition: all 0.3s;
}
a:hover {
    color: var(--neon-cyan);
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
}

/* --- 倒计时数字发光 --- */
.countdown {
    font-family: 'Audiowide', sans-serif !important;
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.4) !important;
    letter-spacing: 1px !important;
}

/* --- 统计数字发光 --- */
.stat-value, .stat-number {
    font-family: 'Audiowide', sans-serif !important;
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.3) !important;
}

/* --- HUD角标装饰 --- */
.post-card::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 20px;
    height: 20px;
    border-right: 1px solid rgba(0, 212, 255, 0.15);
    border-bottom: 1px solid rgba(0, 212, 255, 0.15);
    border-bottom-right-radius: 16px;
    transition: all 0.35s;
    opacity: 0.5;
}
.post-card:hover::after {
    width: 40px;
    height: 40px;
    border-color: rgba(0, 212, 255, 0.5);
    opacity: 1;
}

/* --- 加载动画文字发光 --- */
.loader-text {
    text-shadow:
        0 0 10px rgba(0, 212, 255, 0.8),
        0 0 20px rgba(0, 212, 255, 0.5),
        0 0 40px rgba(0, 212, 255, 0.3) !important;
    letter-spacing: 4px !important;
}

/* --- 输入框通用科幻样式 --- */
input[type="text"], input[type="password"], input[type="email"], textarea {
    background: rgba(0, 5, 15, 0.6) !important;
    border: 1px solid rgba(0, 212, 255, 0.12) !important;
    border-radius: 12px !important;
    color: var(--text-primary) !important;
    transition: all 0.3s !important;
}
input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus, textarea:focus {
    border-color: var(--neon-blue) !important;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.15) !important;
    outline: none !important;
}

/* --- 个人主页卡片 --- */
.profile-header, .profile-section {
    background: rgba(8, 12, 22, 0.82) !important;
    border: 1px solid rgba(0, 212, 255, 0.12) !important;
    border-radius: 16px !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4) !important;
}

/* --- 发射状态标签发光 --- */
.launch-status, .status-badge {
    text-shadow: 0 0 6px rgba(0, 212, 255, 0.3) !important;
    letter-spacing: 1px !important;
}

/* --- 页脚科幻样式 --- */
.footer, .footer-text {
    color: rgba(96, 128, 160, 0.5) !important;
    text-align: center;
    letter-spacing: 1px !important;
}

/* --- 分隔线科幻样式 --- */
hr, .divider {
    border: none !important;
    height: 1px !important;
    background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent) !important;
}

/* --- 移动端优化 --- */
@media (max-width: 768px) {
    .header h1 {
        font-size: 2rem !important;
        text-shadow: 0 0 8px rgba(0, 212, 255, 0.5), 0 0 16px rgba(0, 212, 255, 0.3) !important;
    }
    .post-card {
        padding: 16px !important;
    }
    .post-card::after {
        display: none;
    }
}

/* ==================== 在线用户显示 ==================== */
.online-users-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(8, 12, 22, 0.6);
    border: 1px solid rgba(0, 212, 255, 0.1);
    border-radius: 12px;
    margin-bottom: 16px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    flex-wrap: wrap;
    overflow: hidden;
}
.online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
    animation: onlinePulse 2s ease-in-out infinite;
    flex-shrink: 0;
}
@keyframes onlinePulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(0, 255, 136, 0.6); }
    50% { opacity: 0.6; box-shadow: 0 0 12px rgba(0, 255, 136, 0.9); }
}
.online-label {
    font-size: 0.82rem;
    color: var(--text-secondary);
    white-space: nowrap;
    letter-spacing: 0.5px;
}
.online-count {
    color: var(--neon-cyan);
    font-weight: 700;
    text-shadow: 0 0 6px rgba(0, 212, 255, 0.4);
}
.online-avatars {
    display: flex;
    gap: 4px;
    margin-left: auto;
    flex-wrap: wrap;
}
.online-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(0, 212, 255, 0.3);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.3s;
}
.online-avatar:hover {
    border-color: var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    transform: scale(1.1);
}
.online-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ==================== NASA APOD ==================== */
.apod-container {
    background: rgba(8, 12, 22, 0.88);
    border: 1px solid rgba(0, 212, 255, 0.15);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 4px 32px rgba(0, 0, 0, 0.5), 0 0 1px rgba(0, 212, 255, 0.1);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.apod-container:hover {
    border-color: rgba(0, 212, 255, 0.35);
    box-shadow: 0 0 36px rgba(0, 212, 255, 0.12), 0 10px 40px rgba(0, 0, 0, 0.55);
    transform: translateY(-2px);
}
.apod-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(0, 212, 255, 0.08);
}
.apod-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    background: rgba(0, 212, 255, 0.15);
    border-radius: 6px;
    color: var(--neon-cyan);
    font-weight: 700;
    letter-spacing: 1px;
}
.apod-title {
    font-family: 'Michroma', sans-serif;
    font-size: 0.95rem;
    color: var(--text-primary);
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.apod-body {
    display: flex;
    gap: 0;
}
.apod-image-wrap {
    flex: 0 0 45%;
    max-width: 300px;
    cursor: pointer;
}
.apod-image-wrap img {
    width: 100%;
    height: 100%;
    min-height: 200px;
    max-height: 280px;
    object-fit: cover;
    display: block;
}
.apod-info {
    flex: 1;
    padding: 16px 20px;
    overflow-y: auto;
    max-height: 280px;
}
.apod-info h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: var(--neon-cyan);
    text-shadow: 0 0 6px rgba(0, 212, 255, 0.2);
}
.apod-info p {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.6;
}
.apod-info .apod-date {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 8px;
}
.apod-loading {
    padding: 40px;
    text-align: center;
    color: var(--text-muted);
}
@media (max-width: 600px) {
    .apod-body { flex-direction: column; }
    .apod-image-wrap { max-width: 100%; }
    .apod-image-wrap img { max-height: 200px; }
}

/* ==================== 举报弹窗 ==================== */
.report-modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 2, 8, 0.75);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
.report-modal-overlay.show { display: flex; }
.report-modal {
    background: rgba(6, 10, 20, 0.95);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 20px;
    padding: 32px 28px 28px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.1), 0 20px 60px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(20px);
    position: relative;
}
.report-modal::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 100, 100, 0.6), transparent);
}
.report-reason-btn {
    display: block;
    width: 100%;
    padding: 12px 16px;
    margin-bottom: 8px;
    background: rgba(0, 5, 15, 0.6);
    border: 1px solid rgba(0, 212, 255, 0.12);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s;

    font-family: inherit;
}
.report-reason-btn:hover {
    border-color: rgba(255, 100, 100, 0.4);
    background: rgba(255, 100, 100, 0.05);
}
.report-reason-btn.selected {
    border-color: rgba(255, 100, 100, 0.5);
    background: rgba(255, 100, 100, 0.1);
}
.report-submit-btn {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: linear-gradient(135deg, rgba(255, 68, 102, 0.9), rgba(200, 50, 80, 0.9));
    color: #fff;
    border: none;
    border-radius: 12px;

        async function updatePostDB(postId) {
            const post = posts.find(p => String(p.id) === String(postId));

                    likes: post.likes || 0,

        // ==================== 发帖 ====================

            const content = document.getElementById('modalContent').value.trim();
            const sourceUrl = document.getElementById('modalSourceUrl') ? (document.getElementById('modalSourceUrl').value.trim() || '') : '';

                document.getElementById('modalName').focus();
                return;
            }
            if (!title && !content) {
                document.getElementById('modalTitle').focus();

            }
            const btn = document.getElementById('submitBtn');

            // === 编辑模式 ===
            if (editingPostId) {
                try {
                    const editImage = document.getElementById('modalImage') ? (document.getElementById('modalImage').value.trim() || '') : '';
                    const ep = posts.find(p => String(p.id) === String(editingPostId));

                    const { error: editErr } = await sb.from('posts').update({
                        title: title,
                        content: content,
                        image: editImage,
                        source_url: sourceUrl
                    }).eq('id', editingPostId);

                        ep.title = title;
                        ep.content = content;
                        ep.image = editImage;
                        ep.source_url = sourceUrl;
                    }
                    closeModal();
                    renderPosts();

                    alert('保存失败: ' + err.message);

                btn.textContent = '发布';
                return;

            const newPost = {

                image: document.getElementById('modalImage') ? (document.getElementById('modalImage').value.trim() || '') : '',
                source_url: sourceUrl,
                time: Date.now(),
                likes: 0,
                comments: []
            };
            // 插入到 Supabase
            try {
                const { error } = await sb.from('posts').insert({
                    id: newPost.id,
                    title: newPost.title,
                    content: newPost.content,
                    author: newPost.author,
                    avatar: newPost.avatar,
                    image: newPost.image,
                    source_url: newPost.source_url || '',
                    time: newPost.time,
                    likes: 0,
                    comments: [],
                    pinned: false
                });
                if (error) throw error;
                posts.unshift(newPost);
                closeModal();
                // Send mention notifications
                var mentionedUsers = extractMentions(content + ' ' + title);
                mentionedUsers.forEach(function(uname) {
                    if (uname !== newPost.author && allUsers.some(function(u) { return u.name === uname; })) {

        // ==================== 点赞 ====================
        async function toggleLike(id) {
            const isLiked = likedPosts[id] || false;
            // 在本地找到帖子并修改
            const post = posts.find(p => p.id === id);
            if (post) {
                post.likes = isLiked ? Math.max(0, (post.likes || 0) - 1) : (post.likes || 0) + 1;
                if (!isLiked && currentUser && post.author !== currentUser.name) {
                    addNotification(post.author, currentUser.name, 'like', post.id, currentUser.name + ' 赞了你的帖子' + (post.title ? '「' + post.title + '」' : ''));

            }

            localStorage.setItem('likedPosts', JSON.stringify(likedPosts));

            // 同步到 Supabase
            updatePostDB(id);

        // ==================== 渲染 ====================
        let searchKeyword = '';
        function handleSearch(val) {
            searchKeyword = val.trim().toLowerCase();
            document.getElementById('searchClear').style.display = searchKeyword ? 'block' : 'none';
            renderPosts();
        }
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchKeyword = '';
            document.getElementById('searchClear').style.display = 'none';
            renderPosts();
        }
        function renderPosts() {
            const list = document.getElementById('postsList');
            let displayPosts = [...posts];
            // 搜索过滤
            if (searchKeyword) {
                displayPosts = displayPosts.filter(p => {
                    const title = (p.title || '').toLowerCase();
                    const content = (p.content || '').toLowerCase();
                    const author = (p.author || '').toLowerCase();
                    const source = (p.source_url || '').toLowerCase();
                    return title.includes(searchKeyword) || content.includes(searchKeyword) || author.includes(searchKeyword) || source.includes(searchKeyword);
                });
            }

            // 关注过滤
            if (currentTab === 'follow') {
                const followed = JSON.parse(localStorage.getItem('space_follows')) || [];
                displayPosts = displayPosts.filter(p => followed.includes(p.author));
            }
            if (currentTab === 'hot') {
                displayPosts.sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return (b.likes || 0) - (a.likes || 0);
                });
            } else {
                displayPosts.sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return (b.time || 0) - (a.time || 0);
                });
            }
            if (displayPosts.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">${searchKeyword ? '🔍' : (currentTab === 'follow' ? '👥' : '🚀')}</div>
                        <p>${searchKeyword ? '没有找到匹配的帖子，换个关键词试试吧' : (currentTab === 'follow' ? '还没有关注任何用户，去帖子中点击头像关注吧' : '还没有帖子，点击右上角发布第一条宇宙探索动态吧')}</p>
                    </div>
                `;
                return;
            }
            list.innerHTML = displayPosts.map(post => {
                const isLiked = likedPosts[post.id] || false;
                return `
                    <div class="post-card" data-id="${post.id}">
                        <div class="post-header">
                            <div class="post-author">
                                <div class="avatar" style="cursor:pointer;" onclick="showUserProfile('${escapeHtml(post.author)}')">${post.avatar.startsWith('http') ? `<img src="${escapeHtml(post.avatar)}" alt="avatar">` : escapeHtml(post.avatar)}</div>
                                <div class="author-info">
                                    <span class="author-name">
                                        ${escapeHtml(post.author)}
                                        ${OFFICIAL_USERS[post.author] ? `<span class="badge-official">${OFFICIAL_USERS[post.author].badge}</span>` : ''}
                                    </span>
                                    <span class="post-time">${formatTime(post.time)}</span>
                                    </div>
                            </div>
                            <div style="display: flex; flex-shrink: 0; gap: 4px;">
                                <button class="pin-btn" onclick="togglePin('${post.id}')" title="置顶/取消置顶">${post.pinned ? '📌 取消置顶' : '📌 置顶'}</button>
                                ${currentUser && post.author === currentUser.name ? `<button class="edit-btn" onclick="editPost('${post.id}')" title="编辑帖子">✏️ 编辑</button>` : ''}
                                <button class="delete-btn" onclick="deletePost('${post.id}')" title="删除帖子">🗑 删除</button>
                            </div>
                        </div>
                        ${post.title ? `<div class="post-title">${post.pinned ? '📌 ' : ''}${escapeHtml(post.title)}</div>` : ''}
                        ${hasVideoUrl(post) ? getPostVideoHtml(post) : (post.image ? `<div class='post-images'><img src='${escapeHtml(post.image)}' class='post-image' alt='图片' onerror="this.style.display='none'"></div>` : '')}
                        <div class="post-content">${parseMentions(post.content)}</div>
                        ${post.source_url ? `<div class="post-source"><span class="source-label">📄 内容来源：</span><a href="${escapeHtml(post.source_url)}" target="_blank" rel="noopener noreferrer" class="source-link">${escapeHtml(post.source_url.length > 60 ? post.source_url.substring(0, 60) + '...' : post.source_url)}</a></div>` : ''}
                        <div class="post-footer">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                                <span>${isLiked ? '❤️' : '🤍'}</span>
                                <span>${post.likes || 0}</span>
                            </button>
                            <button class="comments-toggle-btn" onclick="toggleComments('${post.id}')">
                                <span>💬</span>
                                <span>${(post.comments && post.comments.length) || 0}</span>
                            </button>
                            ${currentUser && post.author !== currentUser.name ? `<button class="report-btn" onclick="openReportModal('${post.id}')">🚩 举报</button>` : ''}
                            </div>
                        <div class="comments-section" id="comments-${post.id}">
                            <div class="comments-list" id="comments-list-${post.id}">
                                ${(post.comments && post.comments.length > 0) ? post.comments.map(c => `
                                    <div class="comment-item">
                                        <div class="comment-avatar">🌟</div>
                                        <div class="comment-body">
                                            <div class="comment-author">${escapeHtml(c.author)}</div>
                                            <div class="comment-text">${parseMentions(c.content)}</div>
                                            <div class="comment-time">${formatTime(c.time)}</div>
                                        </div>
                                        <button class="action-btn" style="color:#ff5555;font-size:12px;" onclick="deleteComment('${post.id}', '${c.id}')">🗑️</button>
                                    </div>
                                `).join('') : '<div style="color: var(--text-muted); font-size: 0.85rem; padding: 8px 0;">暂无评论，来做第一个评论的人吧</div>'}
                            </div>
                            <div class="comment-input-area">
                                <div class="comment-input-row">
                                    <input type="text" class="comment-input" id="comment-name-${post.id}" placeholder="你的名字" maxlength="20">
                                </div>
                                <textarea class="comment-textarea" id="comment-text-${post.id}" placeholder="写下你的评论..." maxlength="300"></textarea>
                                <button class="comment-submit" onclick="submitComment('${post.id}')">发送评论</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        async function togglePin(postId) {
            const password = prompt('请输入管理员密码：');
            if (password === null) return;
            if (password !== '1028') {
                alert('密码错误！');
                return;
            }
            const post = posts.find(p => String(p.id) === String(postId));
            if (post) {
                post.pinned = !post.pinned;
                await updatePostDB(postId);
                renderPosts();
                alert(post.pinned ? '📌 已置顶' : '📌 已取消置顶');
            }
        }
        async function deletePost(postId) {
            const password = prompt('请输入删除密码:');
            if (password === null) return;
            if (password !== '1028') {
                alert('密码错误，无法删除！');
                return;
            }
            if (!confirm('确定要删除这条帖子吗？')) return;
            try {
                const { error } = await sb.from('posts').delete().eq('id', postId);
                if (error) throw error;
                posts = posts.filter(p => String(p.id) !== String(postId));
                delete likedPosts[postId];
                localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
                renderPosts();
                alert('🗑 帖子已删除');
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }
        // ==================== 评论功能 ====================
        function toggleComments(postId) {
            const section = document.getElementById('comments-' + postId);
            if (section) {
                section.classList.toggle('show');
            }
        }
        async function submitComment(postId) {
            const nameInput = document.getElementById('comment-name-' + postId);
            const textInput = document.getElementById('comment-text-' + postId);
            const name = nameInput.value.trim();
            const content = textInput.value.trim();
            if (!name) {
                nameInput.focus();
                return;
            }
            if (!content) {
                textInput.focus();
                return;
            }
            const post = posts.find(p => String(p.id) === String(postId));
            if (!post) return;
            if (!post.comments) post.comments = [];
            post.comments.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                author: name,
                content: content,
                time: Date.now()
            });
            nameInput.value = '';
            textInput.value = '';
            await updatePostDB(postId);
            renderPosts();
            // 重新展开评论区
            setTimeout(() => {
                const section = document.getElementById('comments-' + postId);
                if (section) section.classList.add('show');
            }, 50);
            // 发送通知
            if (currentUser && post.author !== currentUser.name) {
                addNotification(post.author, currentUser.name, 'comment', postId, currentUser.name + ' 评论了你的帖子' + (post.title ? '「' + post.title + '」' : ''));
            } else if (!currentUser && post.author !== name) {
                addNotification(post.author, name, 'comment', postId, name + ' 评论了你的帖子' + (post.title ? '「' + post.title + '」' : ''));
            }
            // @提及通知
            var commentMentions = extractMentions(content);
            var commentAuthor = currentUser ? currentUser.name : name;
            commentMentions.forEach(function(uname) {
                if (uname !== commentAuthor && uname !== post.author && allUsers.some(function(u) { return u.name === uname; })) {
                    addNotification(uname, commentAuthor, 'mention', postId, commentAuthor + ' 在评论中提到了你' + (post.title ? '「' + post.title + '」' : ''));
                }
            });
        }
        async function deleteComment(postId, commentId) {
            const pwd = prompt('请输入删除密码：');
            if (pwd !== '1028') {
                alert('密码错误');
                return;
            }
            const post = posts.find(p => String(p.id) === String(postId));
            if (!post || !post.comments) return;
            const firstIdx = post.comments.findIndex(c => String(c.id) === String(commentId));
            if (firstIdx === -1) return;
            post.comments.splice(firstIdx, 1);
            await updatePostDB(postId);
            renderPosts();
            setTimeout(() => {
                const section = document.getElementById('comments-' + postId);
                if (section) section.classList.add('show');
            }, 50);
        }
        // ==================== 工具函数 ====================
        function formatTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const minute = 60 * 1000;
            const hour = 60 * minute;
            const day = 24 * hour;
            if (diff < minute) return '刚刚';
            if (diff < hour) return Math.floor(diff / minute) + '分钟前';
            if (diff < day) return Math.floor(diff / hour) + '小时前';
            if (diff < 7 * day) return Math.floor(diff / day) + '天前';
            return new Date(timestamp).toLocaleDateString('zh-CN');
        }
        function getAvatar(name) {
            if (OFFICIAL_USERS[name]) return OFFICIAL_USERS[name].avatar;
            return '🚀';
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;

        async function handleAuth() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            const confirm = document.getElementById('authConfirm').value;
            const errEl = document.getElementById('authError');
            const sucEl = document.getElementById('authSuccess');
            const btn = document.getElementById('authSubmitBtn');
            errEl.classList.remove('show');
            sucEl.classList.remove('show');
            if (!username) { showAuthErr('请输入用户名'); return; }
            if (!password || password.length < 6) { showAuthErr('密码至少6位'); return; }
            btn.disabled = true;
            btn.textContent = '请稍候...';
            await loadUsers();
            if (authMode === 'signup') {
                if (password !== confirm) { showAuthErr('两次密码不一致'); btn.disabled = false; btn.textContent = '注册'; return; }
                const exists = allUsers.find(u => u.name.toLowerCase() === username.toLowerCase());
                if (exists) { showAuthErr('该用户名已被注册'); btn.disabled = false; btn.textContent = '注册'; return; }
                const newUser = { name: username, password: password, avatar: getAvatar(username) };
                allUsers.push(newUser);
                await saveUser(newUser);
                showAuthSuc('注册成功！请登录');
                authMode = 'login';
                updateAuthUI();
                document.getElementById('authPassword').value = '';
                document.getElementById('authConfirm').value = '';
            } else {
                const user = allUsers.find(u => u.name.toLowerCase() === username.toLowerCase());
                if (!user || user.password !== password) { showAuthErr('用户名或密码错误'); btn.disabled = false; btn.textContent = '登录'; return; }
                if (user.banned || false) { showAuthErr('该账号已被禁言，请联系管理员'); btn.disabled = false; btn.textContent = '登录'; return; }
                currentUser = { name: user.name, avatar: user.avatar };
                localStorage.setItem('space_user', JSON.stringify(currentUser));
                closeAuthModal();
                renderAuthArea();
            }
            btn.disabled = false;
            btn.textContent = authMode === 'login' ? '登录' : '注册';

        // ==================== 火箭发射时间表 ====================
        let launches = [];

        function renderLaunches() {
            const list = document.getElementById('launchList');

            if (!list) return;
            const now = Date.now();
            // 分离即将发射和已发射
            const upcoming = [];
            const launched = [];
            launches.forEach((l, i) => {
                if (l.status === 'tbd') {
                    // TBD 发射始终留在"近期发射"
                    upcoming.push({ data: l, origIndex: i });
                } else if (l.date - now <= 0) {
                    launched.push({ data: l, origIndex: i });
                } else {
                    upcoming.push({ data: l, origIndex: i });
                }
            });
            // 已发射按时间倒序，只保留前15个
            launched.sort((a, b) => b.data.date - a.data.date);
            if (launched.length > 15) {
                const toRemove = launched.slice(15);
                for (const item of toRemove) {
                    if (item.data.id) {
                        sb.from('launches').delete().eq('id', item.data.id).then(() => {}).catch(e => console.error('删除旧发射记录失败:', e));
                    }
                    const idx = launches.indexOf(item.data);
                    if (idx !== -1) launches.splice(idx, 1);
                }
                launched.length = 15;
            }
            // 渲染即将发射
            list.innerHTML = upcoming.length > 0 ? upcoming.map((item) => {
                const l = item.data;
                const i = item.origIndex;
                const diff = l.date - now;
                const isTBD = l.status === 'tbd';
                let badgeClass = 'badge-upcoming';
                let badgeText = '即将发射';
                if (isTBD) {
                    badgeClass = 'badge-tentative';
                    badgeText = '日期待定';
                } else {
                    if (l.status === 'tentative') {
                        badgeClass = 'badge-tentative';
                        badgeText = '待定';
                    }
                    if (diff > 0 && diff < 3 * 24 * 60 * 60 * 1000) {
                        badgeClass = 'badge-soon';
                        badgeText = '发射在即';
                    }
                }
                const dateStr = isTBD ? '发射日期待确定' : new Date(l.date).toLocaleString('zh-CN', {
                    month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                let countdownHtml;
                if (isTBD) {
                    countdownHtml = `<div class="launch-countdown"><div class="launch-tbd-message">⏳ 发射日期待确定</div></div>`;
                } else {
                    const days = Math.floor(diff / (24 * 60 * 60 * 1000));
                    const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                    const mins = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
                    const secs = Math.floor((diff % (60 * 1000)) / 1000);
                    countdownHtml = `
                        <div class="launch-countdown">
                            <div class="countdown-box">

                                <div class="countdown-label">分</div>
                            </div>
                            <div class="countdown-box">
                                <div class="countdown-num" id="cd-secs-${i}">${String(secs).padStart(2,'0')}</div>
                                <div class="countdown-label">秒</div>
                            </div>

                        <div class="launch-card-top">
                            <div class="launch-info">

                                <div class="launch-agency">${l.agency}</div>

                                    <span>📅 ${dateStr}</span>
                                    <span>📍 ${l.location}</span>
                                    <span>🎯 ${l.mission}</span>

                            </div>
                            <span class="launch-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        ${countdownHtml}
                        ${l.image ? `<img src="${escapeHtml(l.image)}" class="launch-image" alt="发射图片" onerror="this.style.display='none'">` : ''}
                        <div class="launch-desc">${escapeHtml(l.description)}</div>
                        ${currentUser && isOfficialUser(currentUser.name) ? `
                        <div class="launch-card-actions">
                            <button class="launch-edit-btn" onclick="editLaunch(${i})">✏️ 编辑</button>
                            <button class="launch-delete-btn" onclick="deleteLaunch(${i})">🗑 删除</button>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('') : '<div class="empty-state"><div class="emoji">🚀</div><p>暂无即将发射的火箭</p></div>';
            // 渲染已发射
            if (launchedList) {
                launchedList.innerHTML = getLaunchStatsHtml() + (launched.length > 0 ? launched.map((item) => {
                    const l = item.data;
                    const i = item.origIndex;
                    const dateStr = new Date(l.date).toLocaleString('zh-CN', {
                        month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                    const ago = Date.now() - l.date;
                    const agoDays = Math.floor(ago / (24 * 60 * 60 * 1000));
                    const agoHours = Math.floor((ago % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                    const agoMins = Math.floor((ago % (60 * 60 * 1000)) / (60 * 1000));
                    let agoStr = '';
                    if (agoDays > 0) agoStr = `${agoDays}天${agoHours}小时前`;
                    else if (agoHours > 0) agoStr = `${agoHours}小时${agoMins}分钟前`;
                    else agoStr = `${agoMins}分钟前`;
                    return `
                        <div class="launch-card launched-card">
                            <div class="launch-card-top">
                                <div class="launch-info">
                                    <div class="launch-rocket">${l.rocket}</div>
                                    <div class="launch-agency">${l.agency}</div>
                                    <div class="launch-meta">
                                        <span>📅 ${dateStr}</span>
                                        <span>📍 ${l.location}</span>
                                        <span>🎯 ${l.mission}</span>
                                    </div>
                                </div>
                                <span class="launch-badge badge-launched">已发射</span>
                            </div>
                            <div class="launched-time">🚀 发射于 <strong>${agoStr}</strong></div>
                            ${getLaunchResultBadge(l.result)}
                            ${l.image ? `<img src="${escapeHtml(l.image)}" class="launch-image" alt="发射图片" onerror="this.style.display='none'">` : ''}
                            <div class="launch-desc">${escapeHtml(l.description)}</div>
                            ${getLaunchResultActions(i, true)}
                            ${currentUser && isOfficialUser(currentUser.name) ? `
                            <div class="launch-card-actions">
                                <button class="launch-edit-btn" onclick="editLaunch(${i})">✏️ 编辑</button>
                                <button class="launch-delete-btn" onclick="deleteLaunch(${i})">🗑 删除</button>
                            </div>
                            ` : ''}
                        </div>
                    `;
                }).join('') : '<div class="empty-state"><div class="emoji">🏁</div><p>暂无已发射的火箭</p></div>');
            }
        }

        function updateCountdowns() {
            const now = Date.now();
            let needRerender = false;
            launches.forEach((l, i) => {
                if (l.status === 'tbd') return; // 跳过TBD发射
                const diff = l.date - now;
                if (diff <= 0) {
                    needRerender = true;
                    return;
                }
                const days = Math.floor(diff / (24 * 60 * 60 * 1000));
                const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                const mins = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
                const secs = Math.floor((diff % (60 * 1000)) / 1000);
                const dEl = document.getElementById('cd-days-' + i);
                const hEl = document.getElementById('cd-hours-' + i);
                const mEl = document.getElementById('cd-mins-' + i);
                const sEl = document.getElementById('cd-secs-' + i);
                if (dEl) dEl.textContent = days;
                if (hEl) hEl.textContent = String(hours).padStart(2, '0');
                if (mEl) mEl.textContent = String(mins).padStart(2, '0');
                if (sEl) sEl.textContent = String(secs).padStart(2, '0');
            });
            if (needRerender) renderLaunches();

        async function submitLaunch() {
            if (!currentUser || !isOfficialUser(currentUser.name)) {
                alert('只有官方机构账号才能管理发射时间表');
                return;
            }
            const rocket = document.getElementById('launchRocket').value.trim();
            const agency = document.getElementById('launchAgency').value.trim();
            const dateStr = document.getElementById('launchDate').value;
            const location = document.getElementById('launchLocation').value.trim();
            const mission = document.getElementById('launchMission').value.trim();
            const image = document.getElementById('launchImage').value.trim();
            const desc = document.getElementById('launchDesc').value.trim();
            const isTBD = document.getElementById('launchDateTBD').checked;
            if (!rocket) { document.getElementById('launchRocket').focus(); return; }
            if (!isTBD && !dateStr) { document.getElementById('launchDate').focus(); return; }
            const btn = document.getElementById('launchSubmitBtn');
            btn.disabled = true;
            btn.textContent = '保存中...';
            const launchData = {
                rocket: rocket,
                agency: agency,
                date: isTBD ? null : new Date(dateStr).getTime(),
                location: location,
                mission: mission,
                image: image,
                description: desc,
                status: isTBD ? 'tbd' : 'tentative'
            };
            if (editingLaunchId !== null) {
                // 更新现有发射记录
                const existing = launches[editingLaunchId];
                const dbId = existing.id;
                const { error } = await sb.from('launches').update({
                    rocket: rocket, agency: agency, date: isTBD ? null : launchData.date,
                    location: location, mission: mission, image: image,
                    description: desc, status: isTBD ? 'tbd' : 'tentative'
                }).eq('id', dbId);
                if (error) { alert('保存失败: ' + error.message); btn.disabled = false; btn.textContent = '保存'; return; }
                launches[editingLaunchId] = { ...launchData, id: dbId };
            } else {
                // 新增发射记录
                const { data: inserted, error } = await sb.from('launches').insert({
                    rocket: rocket, agency: agency, date: isTBD ? null : launchData.date,
                    location: location, mission: mission, image: image,
                    description: desc, status: isTBD ? 'tbd' : 'tentative'
                }).select();
                if (error) { alert('保存失败: ' + error.message); btn.disabled = false; btn.textContent = '保存'; return; }
                if (inserted && inserted[0]) launches.push(inserted[0]);
            }
            // 按日期排序（TBD排到最后）
            launches.sort((a, b) => {
                if (a.status === 'tbd' && b.status !== 'tbd') return 1;
                if (a.status !== 'tbd' && b.status === 'tbd') return -1;
                return (a.date || 0) - (b.date || 0);
            });
            renderLaunches();
            btn.disabled = false;
            btn.textContent = '保存';
            closeLaunchEditor();
        }
        async function deleteLaunch(index) {
            if (!currentUser || !isOfficialUser(currentUser.name)) return;
            if (!confirm('确定要删除这条发射信息吗？')) return;
            const launch = launches[index];

                const { error } = await sb.from('launches').delete().eq('id', launch.id);
                if (error) { alert('删除失败: ' + error.message); return; }
            }
            launches.splice(index, 1);
            renderLaunches();
        }

            var followBtnHtml = '';

                    postsHtml += '<span class="post-time">' + formatTime(post.time) + '</span></div></div></div>';
                    if (post.title) postsHtml += '<div class="post-title">' + escapeHtml(post.title) + '</div>';
                    if (post.image) postsHtml += "<div class='post-images'><img src='" + escapeHtml(post.image) + "' class='post-image' alt='图片'></div>";
                    if (post.content) postsHtml += '<div class="post-content">' + escapeHtml(post.content) + '</div>';
                    postsHtml += '<div class="post-footer"><button class="action-btn ' + (isLiked ? 'liked' : '') + '" onclick="toggleLike(\'' + post.id + '\')"><span>' + (isLiked ? '❤️' : '🤍') + '</span><span>' + (post.likes || 0) + '</span></button></div>';
                    postsHtml += '</div>';
                });
                postsHtml += '</div>';
            } else {
                postsHtml = '<div class="profile-posts"><div class="profile-posts-title">暂无帖子</div></div>';
            }
            contentDiv.innerHTML = '<div class="profile-header"><div class="profile-avatar-large">' + avHtml + '</div><div class="profile-info"><div class="profile-name">' + escapeHtml(username) + ' ' + badge + '</div><div class="profile-stats"><div class="profile-stat"><span class="profile-stat-num">' + userPosts.length + '</span><span>帖子</span></div><div class="profile-stat"><span class="profile-stat-num">' + followingCount + '</span><span>关注</span></div><div class="profile-stat"><span class="profile-stat-num">' + followersCount + '</span><span>粉丝</span></div><div class="profile-stat"><span class="profile-stat-num">' + totalLikes + '</span><span>获赞</span></div>' + '</div></div>' + followBtnHtml + '</div>' + postsHtml;
            modal.classList.add('show');
