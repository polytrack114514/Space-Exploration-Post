<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索宇宙帖子</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
            --bg: #000000;
            --surface: rgba(20, 20, 25, 0.75);
            --surface-hover: rgba(30, 30, 38, 0.85);
            --text-primary: #f0f0f5;
            --text-secondary: #888899;
            --text-muted: #555566;
            --accent: #e8e8f0;
            --accent-hover: #ffffff;
            --border: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(255, 255, 255, 0.15);
            --danger: #ff5555;
            --gold: #ffd700;
            --gold-hover: #ffe44d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.imglt.com/20260803/0994543291ec65795e5eadac3a134b6f.jpg') center/cover no-repeat;
            z-index: 0;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        .header {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px 20px 30px;
        }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: var(--text-primary);
        }
        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 180px;
            max-width: 400px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s;
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box input:focus {
            border-color: var(--gold);
        }
        .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.6;
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            display: none;
        }
        .search-clear:hover {
            color: var(--text-primary);
        }
        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
                    }
        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.01em;
        }
        .tab:hover {
            color: var(--text-primary);
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        .tab .icon {
            margin-right: 6px;
        }
        .fab-post {
            padding: 12px 28px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fab-post:hover {
            background: var(--gold-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(255, 215, 0, 0.25);
        }
        .fab-post:active {
            transform: translateY(0);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.25s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal {
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 32px 32px;
            width: 90%;
            max-width: 480px;
            position: relative;
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .modal-close:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }
        .modal-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 28px;
            color: var(--text-primary);
        }
        .modal-input {
            width: 100%;
            padding: 14px 18px;
            background: #22222e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s;
            margin-bottom: 16px;
        }
        .modal-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }
        .modal-input::placeholder {
            color: var(--text-muted);
        }
        .modal-textarea {
            width: 100%;
            min-height: 140px;
            padding: 14px 18px;
            background: #22222e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            resize: vertical;
            transition: all 0.25s;
            line-height: 1.6;
        }
        .modal-textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }
        .modal-textarea::placeholder {
            color: var(--text-muted);
        }
        .modal-submit {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            margin-top: 20px;
        }
        .modal-submit:hover {
            background: var(--gold-hover);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
        }
        .modal-submit:active {
            transform: scale(0.98);
        }
        .modal-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease;
                    }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 10px;
        }
        .post-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            border: 1px solid var(--border);
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .author-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }
        .post-time {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .post-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .post-content {
            color: rgba(240, 240, 245, 0.85);
            line-height: 1.75;
            font-size: 0.95rem;
            margin-bottom: 18px;
            white-space: pre-wrap;
            word-break: break-word;
            font-weight: 400;
        }
        .post-source {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 14px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }
        .source-label {
            color: var(--text-muted);
            white-space: nowrap;
        }
        .source-link {
            color: #4fc3f7;
            text-decoration: none;
            word-break: break-all;
            transition: color 0.2s;
        }
        .source-link:hover {
            color: #81d4fa;
            text-decoration: underline;
        }
        .pin-btn {
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: rgba(255, 215, 0, 0.8);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
            margin-right: 4px;
        }
        .post-card:hover .pin-btn {
            opacity: 1;
        }
        .pin-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.6);
            color: #ffd700;
        }
        .post-card:has(.pinned) {
            border-color: rgba(255, 215, 0, 0.3);
        }
        /* 登录区域 */
        .auth-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
        }
        .auth-user {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-primary);
                    }
        .auth-avatar-small {
            width: 24px; height: 24px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }
        .auth-name {
            font-weight: 500; max-width: 120px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .btn-logout {
            padding: 4px 10px; background: transparent; border: none;
            color: var(--text-muted); font-size: 0.75rem;
            cursor: pointer; font-family: inherit;
        }
        .btn-logout:hover { color: var(--danger); }
        .btn-auth {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s;
                    }
        .btn-auth:hover {
            color: var(--text-primary);
            border-color: var(--border-focus);
        }
        /* 登录弹窗 */
        .auth-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 150;
            display: none; align-items: center; justify-content: center;
        }
        .auth-modal-overlay.show { display: flex; }
        .auth-modal {
            background: #0f0f0f; border-radius: 20px;
            padding: 36px; width: 90%; max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }
        .auth-modal h2 {
            font-size: 1.3rem; margin-bottom: 24px;
            text-align: center; color: var(--text-primary);
        }
        .auth-field { margin-bottom: 16px; }
        .auth-field label {
            display: block; font-size: 0.82rem;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .auth-field input {
            width: 100%; padding: 12px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem; font-family: inherit; outline: none;
        }
        .auth-field input:focus { border-color: var(--border-focus); }
        .auth-field input::placeholder { color: var(--text-muted); }
        .auth-submit {
            width: 100%; padding: 12px;
            background: #ffffff; color: #000000;
            border: none; border-radius: 12px;
            font-size: 0.92rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s; margin-top: 8px;
        }
        .auth-submit:hover { background: #e0e0e0; }
        .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-switch {
            text-align: center; margin-top: 16px;
            font-size: 0.82rem; color: var(--text-muted);
        }
        .auth-switch a {
            color: var(--gold); cursor: pointer; text-decoration: none;
        }
        .auth-switch a:hover { text-decoration: underline; }
        .auth-error {
            background: rgba(255,85,85,0.1);
            border: 1px solid rgba(255,85,85,0.2);
            border-radius: 10px; padding: 10px 14px;
            color: #ff8888; font-size: 0.82rem;
            margin-bottom: 16px; display: none;
        }
        .auth-error.show { display: block; }
        .auth-success {
            background: rgba(100,255,100,0.1);
            border: 1px solid rgba(100,255,100,0.2);
            border-radius: 10px; padding: 10px 14px;
            color: #88ff88; font-size: 0.82rem;
            margin-bottom: 16px; display: none;
        }
        .auth-success.show { display: block; }
        .auth-close {
            position: absolute; top: 12px; right: 16px;
            background: transparent; border: none;
            color: var(--text-muted); font-size: 1.2rem; cursor: pointer;
        }
        /* 图片上传 */
        .image-input-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
        }
        .image-input {
            flex: 1; padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.88rem; font-family: inherit; outline: none;
        }
        .image-input:focus { border-color: var(--border-focus); }
        .image-input::placeholder { color: var(--text-muted); }
        .post-images {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
        }
        .post-image {
            max-width: 100%; max-height: 300px;
            border-radius: 12px; border: 1px solid var(--border);
            object-fit: cover;
        }
        /* 分享按钮 */
        /* 烟花 */
        @media (max-width: 600px) {
            .pin-btn {
                opacity: 1;
            }
        }
        .delete-btn {
            background: transparent;
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: rgba(255, 120, 120, 0.7);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .post-card:hover .delete-btn {
            opacity: 1;
        }
        .delete-btn:hover {
            background: rgba(255, 80, 80, 0.15);
            border-color: rgba(255, 100, 100, 0.6);
            color: rgba(255, 150, 150, 1);
        }

    50% { opacity: 1; }

    <div class="loader-stars" id="loaderStars"></div>
    <div class="rocket-loader">🚀</div>
    <div class="loader-text">正在探索宇宙...</div>
</div>
<div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <header class="header">
        <h1>探索宇宙帖子</h1>
        <p>探索浩瀚宇宙，分享星辰大海，一起畅聊太空奥秘</p>
    </header>

    <!-- 火箭发射时间表 -->
    <div class="launch-section">
        <div class="launch-tabs">
            <button class="launch-tab active" data-launch-tab="upcoming">
                <span>🚀 近期发射</span>
            </button>
            <button class="launch-tab" data-launch-tab="launched">
                <span>🏁 已发射</span>
            </button>
            <button class="launch-tab" data-launch-tab="calendar">
                <span>📅 日历</span>
            </button>
            <div class="launch-controls-wrap" id="launchControlsWrap"></div>
        </div>
        <div class="launch-list" id="launchList"></div>
        <div class="launch-list" id="launchedList" style="display:none;"></div>
        <div class="launch-list" id="calendarList" style="display:none;"><div class="calendar-container" id="calendarContainer"></div></div>
    </div>
    <div class="container">
        <div class="top-bar">
            <div class="tabs">
                <button class="tab active" data-tab="hot">
                    <span class="icon">🔥</span>热门
                </button>
                <button class="tab" data-tab="new">
                    <span class="icon">🆕</span>最新
                </button>
                <button class="tab" data-tab="follow">
                    <span class="icon">👥</span>关注
                </button>
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索帖子标题或内容..." oninput="handleSearch(this.value)">
                <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
            </div>
                                    <button class="notify-btn" id="notifyBtn" onclick="openNotifyModal()" title="消息通知">🔔<span class="notify-badge" id="notifyBadge" style="display:none;">0</span></button>
                        <div class="auth-area" id="authArea">
                <button class="btn-auth" onclick="openAuthModal()">登录 / 注册</button>
            </div>
            <button class="fab-post" onclick="openModal()">✨ 发布帖子</button>
        </div>
        <div class="posts-list" id="postsList">
            <div class="loading">正在加载帖子...</div>
        </div>
    </div>
    <!-- 发帖弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="modal-title" id="modalTitleText">发布帖子</div>
            <input type="text" class="modal-input" id="modalName" placeholder="你的名字" maxlength="20">
            <input type="text" class="modal-input" id="modalTitle" placeholder="标题" maxlength="50">
            <div class="image-input-row">
                <input type="text" class="image-input" id="modalImage" placeholder="图片链接（可选，粘贴图片URL）" maxlength="500">
            </div>
            <textarea class="modal-textarea" id="modalContent" placeholder="内容" maxlength="1000"></textarea>
            <input type="text" class="modal-input" id="modalSourceUrl" placeholder="内容来源（可选，粘贴原文网址）" maxlength="500">
            <button class="modal-submit" id="submitBtn" onclick="submitPost()">发布</button>
        </div>
    </div>
    <!-- 发射编辑弹窗 -->
    <div class="modal-overlay" id="launchModalOverlay">
        <div class="modal">
            <button class="modal-close" onclick="closeLaunchEditor()">×</button>
            <div class="modal-title" id="launchModalTitle">添加火箭发射</div>
            <input type="text" class="modal-input" id="launchRocket" placeholder="火箭名称（如：朱雀三号遥二）" maxlength="50">
            <input type="text" class="modal-input" id="launchAgency" placeholder="机构（如：蓝箭航天）" maxlength="50">
            <input type="datetime-local" class="modal-input" id="launchDate" style="color-scheme: dark;">
            <label class="tbd-checkbox-row">
                <input type="checkbox" id="launchDateTBD" onchange="toggleLaunchDateTBD(this.checked)">
                <span>发射日期待确定</span>
            </label>
            <input type="text" class="modal-input" id="launchLocation" placeholder="发射地点" maxlength="100">
            <input type="text" class="modal-input" id="launchMission" placeholder="任务（简短描述）" maxlength="100">
            <input type="text" class="modal-input" id="launchImage" placeholder="图片链接（可选）" maxlength="500">
            <textarea class="modal-textarea" id="launchDesc" placeholder="详细描述（可选）" maxlength="500"></textarea>
            <button class="modal-submit" id="launchSubmitBtn" onclick="submitLaunch()">保存</button>
        </div>
    </div>
    <!-- 用户认证弹窗 -->
    <div class="auth-modal-overlay" id="authModal">
        <div class="auth-modal">
            <h2 id="authTitle">登录</h2>
            <div class="auth-error" id="authError"></div>
            <div class="auth-success" id="authSuccess"></div>
            <div class="auth-field">
                <label>用户名</label>
                <input type="text" id="authUsername" placeholder="起一个用户名" maxlength="20">
            </div>
            <div class="auth-field">
                <label>密码</label>
                <input type="password" id="authPassword" placeholder="密码（至少6位）">
            </div>
            <div class="auth-field" id="authConfirmField" style="display:none">
                <label>确认密码</label>
                <input type="password" id="authConfirm" placeholder="再输入一次密码">
            </div>
            <button class="auth-submit" id="authSubmitBtn" onclick="handleAuth()">登录</button>
            <div class="auth-switch">
                <span id="authSwitchText">还没有账号？</span>
                <a id="authSwitchLink" onclick="toggleAuthMode()">注册</a>
            </div>
            <button class="auth-close" onclick="closeAuthModal()">&times;</button>
        </div>
    </div>
    <!-- 用户资料弹窗 -->
    <div class="profile-modal-overlay" id="profileModal">
        <div class="profile-modal">
            <button class="profile-close" onclick="closeProfileModal()">&times;</button>
            <div id="profileContent"></div>
        </div>
    </div>

<script>
// ==================== Supabase 配置 ====================
        const SUPABASE_URL = 'https://tktfrrvaqwbtdhiqwnna.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrdGZycnZhcXdidGRoaXF3bm5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MzcyMjYsImV4cCI6MjEwMTMxMzIyNn0.CYNPqmQUrnkMFUq-Bkd_09q7CjQ8rZlNX5brb5-UrbQ';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        // ==================== 数据 ====================
        let posts = [];
        let currentTab = 'hot';
        let likedPosts = JSON.parse(localStorage.getItem('likedPosts')) || {};
        let isLoading = false;
        // ==================== 官方机构账号配置 ====================
        const OFFICIAL_USERS = {
            'NASA': { avatar: 'https://www.nasa.gov/wp-content/themes/nasa/assets/images/nasa-logo.svg', badge: 'NASA官方' },
            'CNSA': { avatar: 'https://picx.zhimg.com/v2-264f1e06887851be0703902fb9f106ca_r.jpg?source=2c26e567', badge: '国家航天局' },
            'SpaceX': { avatar: 'https://i.imglt.com/20260802/f61b49848b4eda0e49a759683af30679.jpg', badge: 'SpaceX官方' },
            '其他火箭发射': { avatar: 'https://i0.hdslb.com/bfs/new_dyn/43b61571f1e9a172c5ef0e1bc70d709f3461574224251726.jpg', badge: '火箭发射' }
        };
        function isOfficialUser(name) {
            return !!OFFICIAL_USERS[name];
        }
        // ==================== 从云端加载帖子 ====================
        async function loadPosts() {
            isLoading = true;
            try {
                const { data: postData, error: postErr } = await sb.from('posts').select('*').order('time', { ascending: false });
                if (postErr) throw postErr;
                posts = postData || [];
                renderPosts();
                // 加载发射数据
                await loadLaunches();
            } catch (err) {
                console.error('加载失败:', err);
                document.getElementById('postsList').innerHTML = '<div class="empty-state"><div class="emoji">⚠️</div><p>加载失败，请检查网络连接</p></div>';
            }
            isLoading = false;
        }
        // ==================== 加载发射数据 ====================
        async function loadLaunches() {
            try {
                const { data, error } = await sb.from('launches').select('*').order('date', { ascending: true });
                if (error) throw error;
                if (data && data.length > 0) {
                    launches = data;
                    renderLaunches();
                } else {
                    // 首次运行，插入默认数据
                    for (const l of launches) {
                        await sb.from('launches').insert({
                            rocket: l.rocket, agency: l.agency, date: l.date,
                            location: l.location, mission: l.mission,
                            image: l.image || '', description: l.description, status: l.status || 'tentative'
                        });
                    }
                }
            } catch (err) {
                console.error('加载发射数据失败:', err);
            }
        }
        // ==================== 更新单个帖子到 Supabase ====================
        async function updatePostDB(postId) {
            const post = posts.find(p => String(p.id) === String(postId));
            if (!post) return;
            try {
                const updateData = {
                    likes: post.likes || 0,
                    comments: post.comments || [],
                    pinned: post.pinned || false,
                    source_url: post.source_url || ''
                };
                if (post.edit_history) updateData.edit_history = post.edit_history;
                const { error } = await sb.from('posts').update(updateData).eq('id', postId);
                if (error) console.error('更新帖子失败:', error);
            } catch (err) {
                console.error('更新帖子失败:', err);
            }
        }
        // ==================== saveLaunches 兼容占位 ====================
        async function saveLaunches() {}
        // ==================== 自动刷新（每1分钟同步一次） ====================
        setInterval(() => {
            if (!isLoading) loadPosts();
        }, 60000);
        // ==================== 模态框 ====================
        function openModal() {
            editingPostId = null;
            document.getElementById('modalTitleText').textContent = '发布帖子';
            document.getElementById('modalOverlay').classList.add('show');
            setTimeout(() => {
                document.getElementById('modalName').focus();
            }, 100);
        }
        function closeModal() {
            editingPostId = null;
            document.getElementById('modalOverlay').classList.remove('show');
            document.getElementById('modalName').value = '';
            document.getElementById('modalTitle').value = '';
            document.getElementById('modalContent').value = '';
            document.getElementById('modalImage').value = '';
            document.getElementById('modalSourceUrl').value = '';
            document.getElementById('modalName').readOnly = false;
            document.getElementById('modalName').style.opacity = '1';
        }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { closeModal(); closeLaunchEditor(); closeProfileModal(); closeNotifyModal(); closeEditHistory(); }
        });
        // ==================== 发帖 ====================
        async function submitPost() {
            const name = document.getElementById('modalName').value.trim();
            const title = document.getElementById('modalTitle').value.trim();
            const content = document.getElementById('modalContent').value.trim();
            const sourceUrl = document.getElementById('modalSourceUrl') ? (document.getElementById('modalSourceUrl').value.trim() || '') : '';
            if (!name) {
                document.getElementById('modalName').focus();
                return;
            }
            if (!title && !content) {
                document.getElementById('modalTitle').focus();
                return;
            }
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = editingPostId ? '保存中...' : '发布中...';

            // === 编辑模式 ===
            if (editingPostId) {
                try {
                    const editImage = document.getElementById('modalImage') ? (document.getElementById('modalImage').value.trim() || '') : '';
                    const ep = posts.find(p => String(p.id) === String(editingPostId));
                    // Save edit history
                    var editHistory = [];
                    if (ep && ep.edit_history) {
                        try { editHistory = JSON.parse(JSON.stringify(ep.edit_history)); } catch(e) { editHistory = []; }
                    }
                    if (ep) {
                        editHistory.push({
                            title: ep.title || '',
                            content: ep.content || '',
                            time: Date.now()
                        });
                    }
                    const { error: editErr } = await sb.from('posts').update({
                        title: title,
                        content: content,
                        image: editImage,
                        source_url: sourceUrl,
                        edit_history: editHistory
                    }).eq('id', editingPostId);
                    if (editErr) throw editErr;
                    if (ep) {
                        ep.title = title;
                        ep.content = content;
                        ep.image = editImage;
                        ep.source_url = sourceUrl;
                        ep.edit_history = editHistory;
                    }
                    closeModal();
                    renderPosts();
                } catch (err) {
                    alert('保存失败: ' + err.message);
                }
                btn.disabled = false;
                btn.textContent = '发布';
                return;
            }

            const newPost = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                title: title,
                content: content,
                author: name,
                avatar: getAvatar(name),
                image: document.getElementById('modalImage') ? (document.getElementById('modalImage').value.trim() || '') : '',
                source_url: sourceUrl,
                time: Date.now(),
                likes: 0,
                comments: []
            };
            // 插入到 Supabase
            try {
                const { error } = await sb.from('posts').insert({
                    id: newPost.id,
                    title: newPost.title,
                    content: newPost.content,
                    author: newPost.author,
                    avatar: newPost.avatar,
                    image: newPost.image,
                    source_url: newPost.source_url || '',
                    time: newPost.time,
                    likes: 0,
                    comments: [],
                    pinned: false
                });
                if (error) throw error;
                posts.unshift(newPost);
                closeModal();
                // Send mention notifications
                var mentionedUsers = extractMentions(content + ' ' + title);
                mentionedUsers.forEach(function(uname) {
                    if (uname !== newPost.author && allUsers.some(function(u) { return u.name === uname; })) {
                        addNotification(uname, newPost.author, 'mention', newPost.id, newPost.author + ' 在帖子中提到了你' + (title ? '「' + title + '」' : ''));
                    }
                });
                currentTab = 'new';
                updateTabs();
                renderPosts();
            } catch (err) {
                alert('发布失败: ' + err.message);
            }
            btn.disabled = false;
            btn.textContent = '发布';
        }
        // ==================== 点赞 ====================
        async function toggleLike(id) {
            const isLiked = likedPosts[id] || false;
            // 在本地找到帖子并修改
            const post = posts.find(p => p.id === id);
            if (post) {
                post.likes = isLiked ? Math.max(0, (post.likes || 0) - 1) : (post.likes || 0) + 1;
                if (!isLiked && currentUser && post.author !== currentUser.name) {
                    addNotification(post.author, currentUser.name, 'like', post.id, currentUser.name + ' 赞了你的帖子' + (post.title ? '「' + post.title + '」' : ''));
                }
            }
            likedPosts[id] = !isLiked;
            localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
            renderPosts();
            // 同步到 Supabase
            updatePostDB(id);
        }
        // ==================== 渲染 ====================
        let searchKeyword = '';
        function handleSearch(val) {
            searchKeyword = val.trim().toLowerCase();
            document.getElementById('searchClear').style.display = searchKeyword ? 'block' : 'none';
            renderPosts();
        }
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchKeyword = '';
            document.getElementById('searchClear').style.display = 'none';
            renderPosts();
        }
        function renderPosts() {
            const list = document.getElementById('postsList');
            let displayPosts = [...posts];
            // 搜索过滤
            if (searchKeyword) {
                displayPosts = displayPosts.filter(p => {
                    const title = (p.title || '').toLowerCase();
                    const content = (p.content || '').toLowerCase();
                    const author = (p.author || '').toLowerCase();
                    const source = (p.source_url || '').toLowerCase();
                    return title.includes(searchKeyword) || content.includes(searchKeyword) || author.includes(searchKeyword) || source.includes(searchKeyword);
                });
            }
            // 关注过滤
            if (currentTab === 'follow') {
                const followed = JSON.parse(localStorage.getItem('space_follows')) || [];
                displayPosts = displayPosts.filter(p => followed.includes(p.author));
            }
            if (currentTab === 'hot') {
                displayPosts.sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return (b.likes || 0) - (a.likes || 0);
                });
            } else {
                displayPosts.sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return (b.time || 0) - (a.time || 0);
                });
            }
            if (displayPosts.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">${searchKeyword ? '🔍' : (currentTab === 'follow' ? '👥' : '🚀')}</div>
                        <p>${searchKeyword ? '没有找到匹配的帖子，换个关键词试试吧' : (currentTab === 'follow' ? '还没有关注任何用户，去帖子中点击头像关注吧' : '还没有帖子，点击右上角发布第一条宇宙探索动态吧')}</p>
                    </div>
                `;
                return;
            }
            list.innerHTML = displayPosts.map(post => {
                const isLiked = likedPosts[post.id] || false;
                return `
                    <div class="post-card" data-id="${post.id}">
                        <div class="post-header">
                            <div class="post-author">
                                <div class="avatar" style="cursor:pointer;" onclick="showUserProfile('${escapeHtml(post.author)}')">${post.avatar.startsWith('http') ? `<img src="${post.avatar}" alt="avatar">` : post.avatar}</div>
                                <div class="author-info">
                                    <span class="author-name">
                                        ${escapeHtml(post.author)}
                                        ${OFFICIAL_USERS[post.author] ? `<span class="badge-official">${OFFICIAL_USERS[post.author].badge}</span>` : ''}
                                    </span>
                                    <span class="post-time">${formatTime(post.time)}</span>
                                    ${(post.edit_history && post.edit_history.length > 0) ? '<span class="edit-badge" onclick="showEditHistory(\'' + post.id + '\')">✏️ 已编辑</span>' : ''}
                                </div>
                            </div>
                            <div style="display: flex; flex-shrink: 0; gap: 4px;">
                                <button class="pin-btn" onclick="togglePin('${post.id}')" title="置顶/取消置顶">${post.pinned ? '📌 取消置顶' : '📌 置顶'}</button>
                                ${currentUser && post.author === currentUser.name ? `<button class="edit-btn" onclick="editPost('${post.id}')" title="编辑帖子">✏️ 编辑</button>` : ''}
                                <button class="delete-btn" onclick="deletePost('${post.id}')" title="删除帖子">🗑 删除</button>
                            </div>
                        </div>
                        ${post.title ? `<div class="post-title">${post.pinned ? '📌 ' : ''}${escapeHtml(post.title)}</div>` : ''}
                        ${hasVideoUrl(post) ? getPostVideoHtml(post) : (post.image ? `<div class='post-images'><img src='${escapeHtml(post.image)}' class='post-image' alt='图片' onerror="this.style.display='none'"></div>` : '')}
                        <div class="post-content">${parseMentions(post.content)}</div>
                        ${post.source_url ? `<div class="post-source"><span class="source-label">📄 内容来源：</span><a href="${escapeHtml(post.source_url)}" target="_blank" rel="noopener noreferrer" class="source-link">${escapeHtml(post.source_url.length > 60 ? post.source_url.substring(0, 60) + '...' : post.source_url)}</a></div>` : ''}
                        <div class="post-footer">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                                <span>${isLiked ? '❤️' : '🤍'}</span>
                                <span>${post.likes || 0}</span>
                            </button>
                            <button class="comments-toggle-btn" onclick="toggleComments('${post.id}')">
                                <span>💬</span>
                                <span>${(post.comments && post.comments.length) || 0}</span>
                            </button>
                            </div>
                        <div class="comments-section" id="comments-${post.id}">
                            <div class="comments-list" id="comments-list-${post.id}">
                                ${(post.comments && post.comments.length > 0) ? post.comments.map(c => `
                                    <div class="comment-item">
                                        <div class="comment-avatar">🌟</div>
                                        <div class="comment-body">
                                            <div class="comment-author">${escapeHtml(c.author)}</div>
                                            <div class="comment-text">${parseMentions(c.content)}</div>
                                            <div class="comment-time">${formatTime(c.time)}</div>
                                        </div>
                                        <button class="action-btn" style="color:#ff5555;font-size:12px;" onclick="deleteComment('${post.id}', '${c.id}')">🗑️</button>
                                    </div>
                                `).join('') : '<div style="color: var(--text-muted); font-size: 0.85rem; padding: 8px 0;">暂无评论，来做第一个评论的人吧</div>'}
                            </div>
                            <div class="comment-input-area">
                                <div class="comment-input-row">
                                    <input type="text" class="comment-input" id="comment-name-${post.id}" placeholder="你的名字" maxlength="20">
                                </div>
                                <textarea class="comment-textarea" id="comment-text-${post.id}" placeholder="写下你的评论..." maxlength="300"></textarea>
                                <button class="comment-submit" onclick="submitComment('${post.id}')">发送评论</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        async function togglePin(postId) {
            const password = prompt('请输入管理员密码：');
            if (password === null) return;
            if (password !== '1028') {
                alert('密码错误！');
                return;
            }
            const post = posts.find(p => String(p.id) === String(postId));
            if (post) {
                post.pinned = !post.pinned;
                await updatePostDB(postId);
                renderPosts();
                alert(post.pinned ? '📌 已置顶' : '📌 已取消置顶');
            }
        }
        async function deletePost(postId) {
            const password = prompt('请输入删除密码:');
            if (password === null) return;
            if (password !== '1028') {
                alert('密码错误，无法删除！');
                return;
            }
            if (!confirm('确定要删除这条帖子吗？')) return;
            try {
                const { error } = await sb.from('posts').delete().eq('id', postId);
                if (error) throw error;
                posts = posts.filter(p => String(p.id) !== String(postId));
                renderPosts();
                alert('🗑 帖子已删除');
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        async function submitComment(postId) {
            const nameInput = document.getElementById('comment-name-' + postId);
            const textInput = document.getElementById('comment-text-' + postId);
            const name = nameInput.value.trim();
            const content = textInput.value.trim();
            if (!name) {
                nameInput.focus();
                return;
            }
            if (!content) {
                textInput.focus();
                return;
            }
            const post = posts.find(p => String(p.id) === String(postId));
            if (!post) return;
            if (!post.comments) post.comments = [];
            post.comments.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                author: name,
                content: content,
                time: Date.now()
            });
            nameInput.value = '';
            textInput.value = '';
            await updatePostDB(postId);
            renderPosts();
            // 重新展开评论区
            setTimeout(() => {
                const section = document.getElementById('comments-' + postId);
                if (section) section.classList.add('show');
            }, 50);
            // 发送通知
            if (currentUser && post.author !== currentUser.name) {
                addNotification(post.author, currentUser.name, 'comment', postId, currentUser.name + ' 评论了你的帖子' + (post.title ? '「' + post.title + '」' : ''));
            } else if (!currentUser && post.author !== name) {
                addNotification(post.author, name, 'comment', postId, name + ' 评论了你的帖子' + (post.title ? '「' + post.title + '」' : ''));
            }
            // @提及通知
            var commentMentions = extractMentions(content);
            var commentAuthor = currentUser ? currentUser.name : name;
            commentMentions.forEach(function(uname) {
                if (uname !== commentAuthor && uname !== post.author && allUsers.some(function(u) { return u.name === uname; })) {
                    addNotification(uname, commentAuthor, 'mention', postId, commentAuthor + ' 在评论中提到了你' + (post.title ? '「' + post.title + '」' : ''));
                }
            });
        }

        function formatTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const minute = 60 * 1000;
            const hour = 60 * minute;
            const day = 24 * hour;
            if (diff < minute) return '刚刚';
            if (diff < hour) return Math.floor(diff / minute) + '分钟前';
            if (diff < day) return Math.floor(diff / hour) + '小时前';
            if (diff < 7 * day) return Math.floor(diff / day) + '天前';
            return new Date(timestamp).toLocaleDateString('zh-CN');
        }

            const errEl = document.getElementById('authError');
            const sucEl = document.getElementById('authSuccess');

            errEl.classList.remove('show');

                const exists = allUsers.find(u => u.name.toLowerCase() === username.toLowerCase());

                if (l.status === 'tbd') {
                    // TBD 发射始终留在"近期发射"
                    upcoming.push({ data: l, origIndex: i });
                } else if (l.date - now <= 0) {
                    launched.push({ data: l, origIndex: i });
                } else {
                    upcoming.push({ data: l, origIndex: i });
                }
            });
            // 已发射按时间倒序，只保留前20个
            launched.sort((a, b) => b.data.date - a.data.date);
            if (launched.length > 15) {
                const toRemove = launched.slice(20);
                for (const item of toRemove) {
                    if (item.data.id) {
                        sb.from('launches').delete().eq('id', item.data.id).then(() => {}).catch(e => console.error('删除旧发射记录失败:', e));

                    const idx = launches.indexOf(item.data);

                        badgeText = '待定';

                    if (diff > 0 && diff < 3 * 24 * 60 * 60 * 1000) {

            // 渲染已发射
            if (launchedList) {

                    const l = item.data;

                        month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                    const ago = Date.now() - l.date;
                    const agoDays = Math.floor(ago / (24 * 60 * 60 * 1000));
                    const agoHours = Math.floor((ago % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                    const agoMins = Math.floor((ago % (60 * 60 * 1000)) / (60 * 1000));
                    let agoStr = '';
                    if (agoDays > 0) agoStr = `${agoDays}天${agoHours}小时前`;
                    else if (agoHours > 0) agoStr = `${agoHours}小时${agoMins}分钟前`;
                    else agoStr = `${agoMins}分钟前`;
                    return `
                        <div class="launch-card launched-card">

                            <div class="launched-time">🚀 发射于 <strong>${agoStr}</strong></div>
                            ${getLaunchResultBadge(l.result)}
                            ${l.image ? `<img src="${escapeHtml(l.image)}" class="launch-image" alt="发射图片" onerror="this.style.display='none'">` : ''}
                            <div class="launch-desc">${escapeHtml(l.description)}</div>
                            ${getLaunchResultActions(i, true)}
                            ${currentUser && isOfficialUser(currentUser.name) ? `

            if (!isTBD && !dateStr) { document.getElementById('launchDate').focus(); return; }
            const btn = document.getElementById('launchSubmitBtn');
            btn.disabled = true;
            btn.textContent = '保存中...';
            const launchData = {
                rocket: rocket,
                agency: agency,
                date: isTBD ? null : new Date(dateStr).getTime(),
                location: location,
                mission: mission,
                image: image,
                description: desc,
                status: isTBD ? 'tbd' : 'tentative'
            };
            if (editingLaunchId !== null) {

// ============================================
// 通知系统 & 私信系统 - 太空探索帖子网站
// ============================================
//
// 依赖全局变量：
//   sb          - Supabase 客户端实例 (supabase.createClient)
//   currentUser - 当前登录用户对象 (有 .name 属性)
//   posts       - 帖点数组
//   allUsers    - 所有用户数组
//
// 依赖已有函数：
//   escapeHtml(str)        - HTML 转义
//   formatTime(timestamp)  - 时间格式化
//   getAvatar(username)    - 获取头像 (返回 URL 或 emoji)
//   openAuthModal()        - 打开登录弹窗
//   closeProfileModal()    - 关闭用户主页弹窗
//   showUserProfile(name)  - 显示用户主页
//   toggleComments(postId) - 切换帖子评论区
//
// 数据库表：
//   notifications(id, target_user, from_user, type, post_id, content, is_read, created_at)
//   messages(id, from_user, to_user, content, is_read, created_at)
//
// 弹窗显示规则：modal 元素添加 class="show" 时显示 (display:flex)
// 所需 DOM 元素 ID：
//   通知：notifyBadge, notifyModal, notifyList

// ============================================

// ===== 全局变量 =====

// 通知系统
let notifications = [];

// 定时器 ID
let _notifyMsgIntervalId = null;

// ============================================
// 通知系统
// ============================================

/**
 * 加载当前用户的通知（最多 50 条，按时间倒序）
 */
async function loadNotifications() {
    if (!currentUser) return;
    try {
        const { data, error } = await sb.from('notifications')
            .select('*')
            .eq('target_user', currentUser.name)
            .order('created_at', { ascending: false })
            .limit(50);
        if (error) throw error;
        notifications = data || [];
        updateNotifyBadge();
    } catch (e) {
        console.error('加载通知失败:', e);
    }
}

/**
 * 更新通知徽章（未读数）
 */
function updateNotifyBadge() {
    const unread = notifications.filter(function (n) { return !n.is_read; }).length;
    const badge = document.getElementById('notifyBadge');
    if (badge) {
        badge.textContent = unread > 99 ? '99+' : unread;
        badge.style.display = unread > 0 ? 'flex' : 'none';
    }
}

/**
 * 打开通知弹窗并标记已读
 */
function openNotifyModal() {
    if (!currentUser) { openAuthModal(); return; }
    const modal = document.getElementById('notifyModal');
    if (modal) {
        modal.classList.add('show');
        renderNotifications();
        // 标记所有为已读
        markAllNotificationsRead();
    }
}

/**
 * 关闭通知弹窗
 */
function closeNotifyModal() {
    const modal = document.getElementById('notifyModal');
    if (modal) modal.classList.remove('show');
}

/**
 * 处理通知点击事件
 * - 如果帖子存在，跳转到帖子并展开评论
 * - 如果帖子已删除，仅关闭弹窗
 * - 如果是关注通知（无 post_id），跳转到用户主页
 * @param {number} index - 通知在 notifications 数组中的索引
 */
function handleNotificationClick(index) {
    var n = notifications[index];
    if (!n) return;
    closeNotifyModal();
    if (n.post_id) {
        // 检查帖子是否仍然存在
        var post = null;
        if (typeof posts !== 'undefined' && Array.isArray(posts)) {
            post = posts.find(function (p) { return String(p.id) === String(n.post_id); });
        }
        if (post && typeof toggleComments === 'function') {
            toggleComments(n.post_id);
        }
        // 帖子已删除则不做跳转，仅关闭弹窗
    } else {
        // 无 post_id 的通知（如关注），跳转到发起者主页
        if (typeof showUserProfile === 'function') {
            showUserProfile(n.from_user);
        }
    }
}

/**
 * 删除单条通知
 * @param {number} index - 通知索引
 * @param {Event} event - 事件对象（阻止冒泡）
 */
async function deleteNotification(index, event) {
    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }
    var n = notifications[index];
    if (!n) return;
    try {
        var { error } = await sb.from('notifications').delete().eq('id', n.id);
        if (error) throw error;
        notifications.splice(index, 1);
        updateNotifyBadge();
        renderNotifications();
    } catch (e) {
        console.error('删除通知失败:', e);
    }
}

/**
 * 渲染通知列表
 * 使用 index 索引方式绑定点击事件，避免字符串转义问题
 */
function renderNotifications() {
    var list = document.getElementById('notifyList');
    if (!list) return;

    if (notifications.length === 0) {
        list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">暂无通知</div>';
        return;
    }

    var iconMap = { 'like': '❤️', 'comment': '💬', 'follow': '👥' };

    list.innerHTML = notifications.map(function (n, index) {
        var icon = iconMap[n.type] || '🔔';
        var timeStr = formatTime(n.created_at);

        var html = '';
        html += '<div class="notification-item' + (n.is_read ? '' : ' unread') + '"';
        html += ' onclick="handleNotificationClick(' + index + ')"';
        html += ' style="cursor:pointer;">';
        html +=   '<div class="notification-icon">' + icon + '</div>';
        html +=   '<div class="notification-content">';
        html +=     '<div class="notification-text">' + escapeHtml(n.content) + '</div>';
        html +=     '<div class="notification-time">' + timeStr + '</div>';
        html +=   '</div>';
        html +=   '<button class="notification-delete-btn"';
        html +=     ' onclick="deleteNotification(' + index + ', event)"';
        html +=     ' title="删除该通知"';
        html +=     ' style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.9rem;padding:4px 8px;opacity:0.6;flex-shrink:0;"';
        html +=     ' onmouseover="this.style.opacity=1"';
        html +=     ' onmouseout="this.style.opacity=0.6">✕</button>';
        html += '</div>';
        return html;
    }).join('');
}

/**
 * 标记所有未读通知为已读
 */
async function markAllNotificationsRead() {
    if (!currentUser || notifications.length === 0) return;
    var unreadIds = notifications.filter(function (n) { return !n.is_read; }).map(function (n) { return n.id; });
    if (unreadIds.length === 0) return;
    try {
        var { error } = await sb.from('notifications')
            .update({ is_read: true })
            .in('id', unreadIds);
        if (error) throw error;
        notifications.forEach(function (n) { n.is_read = true; });
        updateNotifyBadge();
    } catch (e) {
        console.error('标记已读失败:', e);
    }
}

/**
 * 创建通知（不会给自己发通知）
 * @param {string} targetUser - 通知接收者用户名
 * @param {string} fromUser   - 通知发起者用户名
 * @param {string} type       - 通知类型: 'like' | 'comment' | 'follow'
 * @param {string|null} postId - 相关帖子 ID（可选）
 * @param {string} content    - 通知内容
 */
async function addNotification(targetUser, fromUser, type, postId, content) {
    if (!targetUser || !fromUser || targetUser === fromUser) return;
    try {
        var { error } = await sb.from('notifications').insert({
            target_user: targetUser,
            from_user: fromUser,
            type: type,
            post_id: postId || null,
            content: content,
            is_read: false,
            created_at: Date.now()
        });
        if (error) throw error;
    } catch (e) {
        console.error('创建通知失败:', e);
    }
}

// ============================================

// ============================================
// 定时刷新 & 初始化
// ============================================

/**
 * 手动刷新通知和未读私信数
 */
async function refreshNotifyAndMessages() {
    if (!currentUser) return;
    try {
        await loadNotifications();
    } catch (e) {
        console.error('刷新通知和私信失败:', e);
    }
}

/**
 * 初始化通知和私信系统
 * 在页面加载完成或用户登录成功后调用
 * 每 30 秒自动刷新通知和未读私信数
 */
function initNotifyMessageSystem() {
    // 立即加载一次
    if (currentUser) {
        loadNotifications();
    }

    // 清除旧的定时器（防止重复初始化）
    if (_notifyMsgIntervalId) {
        clearInterval(_notifyMsgIntervalId);
    }

    // 每 30 秒定时刷新
    _notifyMsgIntervalId = setInterval(function () {
        if (currentUser) {
            loadNotifications();
        }
    }, 30000);
}

/**
 * 停止通知和私信定时刷新
 * 在用户登出时调用
 */
function stopNotifyMessageSystem() {
    if (_notifyMsgIntervalId) {
        clearInterval(_notifyMsgIntervalId);
        _notifyMsgIntervalId = null;
    }
    // 清空状态
    notifications = [];
    updateNotifyBadge();
}

// 太空探索帖子网站 - 收藏/视频嵌入/发射结果记录功能
// 数据库: Supabase (客户端变量: sb)
// 全局变量: currentUser, posts, launches, isOfficialUser, OFFICIAL_USERS
// ============================================================

// ==================== 视频嵌入功能 ====================

function getVideoEmbed(text) {
    if (!text) return '';
    var url = '';

    // YouTube 链接检测
    // 格式: https://www.youtube.com/watch?v=VIDEO_ID 或 https://youtu.be/VIDEO_ID
    var ytMatch = text.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (ytMatch) {
        var videoId = ytMatch[1];
        return '<div class="video-embed"><iframe src="https://www.youtube.com/embed/' + videoId + '" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>';
    }

    // B站链接检测
    // 格式: https://www.bilibili.com/video/BVxxxxxx 或 https://b23.tv/xxxxxx
    var biliMatch = text.match(/(?:https?:\/\/)?(?:www\.)?(?:bilibili\.com\/video\/|b23\.tv\/)([a-zA-Z0-9]+)/);
    if (biliMatch) {
        var bvid = biliMatch[1];
        // 对于b23.tv短链接，无法直接获取BVID，使用外链跳转
        if (bvid.length <= 8) {
            // b23.tv 短链接，使用跳转
            return '<div class="video-embed" style="display:flex;align-items:center;justify-content:center;background:var(--bg-tertiary);padding:20px;"><a href="https://b23.tv/' + bvid + '" target="_blank" style="color:var(--accent-color);font-size:0.9rem;">📹 点击观看B站视频</a></div>';
        }
        // 提取BV号
        var bvId = bvid.startsWith('BV') ? bvid : 'BV' + bvid;
        return '<div class="video-embed"><iframe src="https://player.bilibili.com/player.html?bvid=' + bvId + '&page=1&high_quality=1" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"></iframe></div>';
    }

    return '';
}

// 检查帖子是否包含视频链接，返回嵌入HTML
function getPostVideoHtml(post) {
    // 检查图片字段和内容字段
    var fromImage = getVideoEmbed(post.image);
    if (fromImage) return fromImage;
    var fromContent = getVideoEmbed(post.content);
    if (fromContent) return fromContent;
    var fromSource = getVideoEmbed(post.source_url);
    if (fromSource) return fromSource;
    return '';
}

// 判断帖子是否包含视频（用于决定是否隐藏图片显示）
function hasVideoUrl(post) {
    return !!(getVideoEmbed(post.image) || getVideoEmbed(post.content) || getVideoEmbed(post.source_url));
}

// ==================== 发射结果记录功能 ====================

// 标记发射结果
async function markLaunchResult(index, result) {
    if (!currentUser || !isOfficialUser(currentUser.name)) {
        alert('只有官方机构账号才能标记发射结果');
        return;
    }
    var launch = launches[index];
    if (!launch || !launch.id) return;

    // 切换：如果已是这个结果，则取消标记回到pending
    var newResult = launch.result === result ? 'pending' : result;

    try {
        const { error } = await sb.from('launches')
            .update({ result: newResult })
            .eq('id', launch.id);
        if (error) throw error;
        launch.result = newResult;
        renderLaunches();
    } catch(e) {
        console.error('标记发射结果失败:', e);
        alert('标记失败: ' + e.message);
    }
}

// 获取发射结果徽章HTML
function getLaunchResultBadge(result) {
    if (!result || result === 'pending') return '';
    var resultMap = {
        'success': { text: '✅ 发射成功', class: 'launch-result-success' },
        'failure': { text: '❌ 发射失败', class: 'launch-result-fail' },
        'partial': { text: '⚠️ 部分成功', class: 'launch-result-partial' }
    };
    var info = resultMap[result];
    if (!info) return '';
    return '<span class="launch-result-badge ' + info.class + '">' + info.text + '</span>';
}

// 获取发射结果操作按钮HTML（仅官方账号可见）
function getLaunchResultActions(index, isLaunched) {
    if (!currentUser || !isOfficialUser(currentUser.name) || !isLaunched) return '';
    var launch = launches[index];
    if (!launch) return '';
    var currentResult = launch.result || 'pending';
    return '<div class="launch-result-actions">' +
        '<button class="launch-result-btn' + (currentResult === 'success' ? ' active' : '') + '" onclick="markLaunchResult(' + index + ', \'success\')" style="' + (currentResult === 'success' ? 'background:rgba(34,197,94,0.2);color:#22c55e;border-color:#22c55e;' : '') + '">✅ 成功</button>' +
        '<button class="launch-result-btn' + (currentResult === 'partial' ? ' active' : '') + '" onclick="markLaunchResult(' + index + ', \'partial\')" style="' + (currentResult === 'partial' ? 'background:rgba(245,158,11,0.2);color:#f59e0b;border-color:#f59e0b;' : '') + '">⚠️ 部分</button>' +
        '<button class="launch-result-btn' + (currentResult === 'failure' ? ' active' : '') + '" onclick="markLaunchResult(' + index + ', \'failure\')" style="' + (currentResult === 'failure' ? 'background:rgba(239,68,68,0.2);color:#ef4444;border-color:#ef4444;' : '') + '">❌ 失败</button>' +
        '</div>';
}

// 获取发射统计HTML
function getLaunchStatsHtml() {
    var successCount = 0, failCount = 0, partialCount = 0, pendingCount = 0;
    var now = Date.now();
    launches.forEach(function(l) {
        if (l.status === 'tbd') return;
        if (l.date && l.date < now) {
            var r = l.result || 'pending';
            if (r === 'success') successCount++;
            else if (r === 'failure') failCount++;
            else if (r === 'partial') partialCount++;
            else pendingCount++;
        }
    });
    var total = successCount + failCount + partialCount;
    if (total === 0 && pendingCount === 0) return '';
    return '<div class="launch-stats">' +
        '<div class="launch-stat-item"><span class="launch-stat-num" style="color:#22c55e;">' + successCount + '</span><span class="launch-stat-label">成功</span></div>' +

        '<div class="launch-stat-item"><span class="launch-stat-num" style="color:#ef4444;">' + failCount + '</span><span class="launch-stat-label">失败</span></div>' +
        '<div class="launch-stat-item"><span class="launch-stat-num" style="color:var(--text-muted);">' + pendingCount + '</span><span class="launch-stat-label">待定</span></div>' +
        '</div>';

// ==================== 日历视图 ====================
var calendarCurrentMonth = new Date();
calendarCurrentMonth.setDate(1);

function renderCalendar() {
    var container = document.getElementById('calendarContainer');
    if (!container) return;
    var year = calendarCurrentMonth.getFullYear();
    var month = calendarCurrentMonth.getMonth();
    var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    var dayHeaders = ['日','一','二','三','四','五','六'];
    var firstDay = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var today = new Date();
    var todayStr = today.getFullYear() + '-' + today.getMonth() + '-' + today.getDate();

    var html = '<div class="calendar-header">';
    html += '<button class="calendar-nav-btn" onclick="calendarPrevMonth()">‹</button>';
    html += '<span class="calendar-month-label">' + year + '年 ' + monthNames[month] + '</span>';
    html += '<button class="calendar-nav-btn" onclick="calendarNextMonth()">›</button>';
    html += '</div>';
    html += '<div class="calendar-grid">';
    for (var d = 0; d < 7; d++) {
        html += '<div class="calendar-day-header">' + dayHeaders[d] + '</div>';
    }
    for (var i = 0; i < firstDay; i++) {
        html += '<div class="calendar-day empty"></div>';
    }
    for (var day = 1; day <= daysInMonth; day++) {
        var cellDate = new Date(year, month, day);
        var cellDateStr = year + '-' + month + '-' + day;
        var isToday = cellDateStr === todayStr;
        var dayLaunches = [];
        launches.forEach(function(l) {
            if (l.status === 'tbd') return;
            if (!l.date) return;
            var ld = new Date(l.date);
            if (ld.getFullYear() === year && ld.getMonth() === month && ld.getDate() === day) {
                dayLaunches.push(l);
            }
        });
        var classes = 'calendar-day';
        if (isToday) classes += ' today';
        if (dayLaunches.length > 0) classes += ' has-launch';
        html += '<div class="' + classes + '">';
        html += '<div class="calendar-day-num">' + day + '</div>';
        dayLaunches.forEach(function(l) {
            var launchClass = 'calendar-launch-item';
            var now = Date.now();
            if (l.date < now) launchClass += ' launched';
            if (l.status === 'tentative') launchClass += ' tbd';
            var timeStr = new Date(l.date).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
            html += '<div class="' + launchClass + '" onclick="showCalendarTooltip(event, \'' + (l.id || '') + '\')">' + timeStr + ' ' + escapeHtml(l.rocket) + '</div>';
        });
        html += '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
}

function calendarPrevMonth() {
    calendarCurrentMonth.setMonth(calendarCurrentMonth.getMonth() - 1);
    renderCalendar();
}
function calendarNextMonth() {
    calendarCurrentMonth.setMonth(calendarCurrentMonth.getMonth() + 1);
    renderCalendar();
}
function showCalendarTooltip(e, launchId) {
    e.stopPropagation();
    var tooltip = document.getElementById('calendarTooltip');
    if (!tooltip) return;
    var launch = launches.find(function(l) { return String(l.id) === String(launchId); });
    if (!launch) return;
    var now = Date.now();
    var statusText = launch.date < now ? '✅ 已发射' : '🚀 即将发射';
    if (launch.status === 'tbd') statusText = '⏳ 日期待定';
    var dateStr = new Date(launch.date).toLocaleString('zh-CN', {month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
    var html = '<div class="calendar-tooltip-rocket">' + escapeHtml(launch.rocket) + '</div>';
    html += '<div class="calendar-tooltip-meta">' + escapeHtml(launch.agency) + ' · ' + statusText + '</div>';
    html += '<div class="calendar-tooltip-meta">📅 ' + dateStr + '</div>';
    html += '<div class="calendar-tooltip-meta">📍 ' + escapeHtml(launch.location) + '</div>';
    html += '<div class="calendar-tooltip-meta">🎯 ' + escapeHtml(launch.mission) + '</div>';
    if (launch.description) html += '<div class="calendar-tooltip-desc">' + escapeHtml(launch.description) + '</div>';
    tooltip.innerHTML = html;
    tooltip.classList.add('show');
    tooltip.style.left = Math.min(e.clientX + 10, window.innerWidth - 300) + 'px';
    tooltip.style.top = Math.min(e.clientY + 10, window.innerHeight - 200) + 'px';
}
document.addEventListener('click', function() {
    var tooltip = document.getElementById('calendarTooltip');
    if (tooltip) tooltip.classList.remove('show');
});

// ==================== 帖子编辑历史 ====================
function closeEditHistory() {
    var modal = document.getElementById('editHistoryModal');
    if (modal) modal.classList.remove('show');
}
function showEditHistory(postId) {
    var post = posts.find(function(p) { return String(p.id) === String(postId); });
    if (!post || !post.edit_history || post.edit_history.length === 0) {
        alert('此帖子没有编辑历史');
        return;
    }
    var content = document.getElementById('editHistoryContent');
    var html = '';
    // Show current version first
    html += '<div class="edit-history-item" style="border-color: var(--accent-color);">';
    html += '<div class="edit-history-time">📅 当前版本 · ' + formatTime(post.time) + '</div>';
    if (post.title) html += '<div class="edit-history-content"><strong>标题:</strong> ' + escapeHtml(post.title) + '</div>';
    if (post.content) html += '<div class="edit-history-content"><strong>内容:</strong> ' + escapeHtml(post.content) + '</div>';
    html += '</div>';
    // Show history versions in reverse order
    for (var i = post.edit_history.length - 1; i >= 0; i--) {
        var h = post.edit_history[i];
        html += '<div class="edit-history-item">';
        html += '<div class="edit-history-time">✏️ 编辑于 ' + formatTime(h.time) + '</div>';
        if (h.title) html += '<div class="edit-history-content"><strong>标题:</strong> ' + escapeHtml(h.title) + '</div>';
        if (h.content) html += '<div class="edit-history-content"><strong>内容:</strong> ' + escapeHtml(h.content) + '</div>';
        html += '</div>';
    }
    content.innerHTML = html;
    var modal = document.getElementById('editHistoryModal');
    if (modal) modal.classList.add('show');
}

function parseMentions(text) {
    if (!text) return '';
    var escaped = escapeHtml(text);
    return escaped.replace(/@([\u4e00-\u9fa5a-zA-Z0-9_]+)/g, function(match, username) {
        return '<span class="mention-link" onclick="showUserProfile(\'' + username + '\')">@' + username + '</span>';
    });
}
function extractMentions(text) {
    if (!text) return [];
    var matches = text.match(/@([\u4e00-\u9fa5a-zA-Z0-9_]+)/g) || [];
    return matches.map(function(m) { return m.substring(1); });
}
