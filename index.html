<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索宇宙帖子</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: rgba(20, 20, 25, 0.75);
            --surface-hover: rgba(30, 30, 38, 0.85);
            --text-primary: #f0f0f5;
            --text-secondary: #888899;
            --text-muted: #555566;
            --accent: #e8e8f0;
            --accent-hover: #ffffff;
            --border: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(255, 255, 255, 0.15);
            --danger: #ff5555;
            --gold: #ffd700;
            --gold-hover: #ffe44d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.imglt.com/20260704/3ce40be8ab8646abcedcdae6572a6ae8.png') center/cover no-repeat;
            z-index: 0;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .header {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px 20px 30px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
                    }

        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.01em;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .tab .icon {
            margin-right: 6px;
        }

        .fab-post {
            padding: 12px 28px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fab-post:hover {
            background: var(--gold-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(255, 215, 0, 0.25);
        }

        .fab-post:active {
            transform: translateY(0);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.25s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 32px 32px;
            width: 90%;
            max-width: 480px;
            position: relative;
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 28px;
            color: var(--text-primary);
        }

        .modal-input {
            width: 100%;
            padding: 14px 18px;
            background: #22222e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s;
            margin-bottom: 16px;
        }

        .modal-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }

        .modal-input::placeholder {
            color: var(--text-muted);
        }

        .modal-textarea {
            width: 100%;
            min-height: 140px;
            padding: 14px 18px;
            background: #22222e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            resize: vertical;
            transition: all 0.25s;
            line-height: 1.6;
        }

        .modal-textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }

        .modal-textarea::placeholder {
            color: var(--text-muted);
        }

        .modal-submit {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            margin-top: 20px;
        }

        .modal-submit:hover {
            background: var(--gold-hover);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
        }

        .modal-submit:active {
            transform: scale(0.98);
        }

        .modal-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease;
                    }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 10px;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            border: 1px solid var(--border);
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .author-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }

        .post-time {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .post-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .post-content {
            color: rgba(240, 240, 245, 0.85);
            line-height: 1.75;
            font-size: 0.95rem;
            margin-bottom: 18px;
            white-space: pre-wrap;
            word-break: break-word;
            font-weight: 400;
        }



        .pin-btn {
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: rgba(255, 215, 0, 0.8);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
            margin-right: 4px;
        }

        .post-card:hover .pin-btn {
            opacity: 1;
        }

        .pin-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.6);
            color: #ffd700;
        }

        .post-card:has(.pinned) {
            border-color: rgba(255, 215, 0, 0.3);
        }

        
        /* 登录区域 */
        .auth-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
        }
        .auth-user {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-primary);
                    }
        .auth-avatar-small {
            width: 24px; height: 24px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }
        .auth-name {
            font-weight: 500; max-width: 120px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .btn-logout {
            padding: 4px 10px; background: transparent; border: none;
            color: var(--text-muted); font-size: 0.75rem;
            cursor: pointer; font-family: inherit;
        }
        .btn-logout:hover { color: var(--danger); }
        .btn-auth {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s;
                    }
        .btn-auth:hover {
            color: var(--text-primary);
            border-color: var(--border-focus);
        }

        /* 登录弹窗 */
        .auth-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 150;
            display: none; align-items: center; justify-content: center;
        }
        .auth-modal-overlay.show { display: flex; }
        .auth-modal {
            background: #0f0f0f; border-radius: 20px;
            padding: 36px; width: 90%; max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }
        .auth-modal h2 {
            font-size: 1.3rem; margin-bottom: 24px;
            text-align: center; color: var(--text-primary);
        }
        .auth-field { margin-bottom: 16px; }
        .auth-field label {
            display: block; font-size: 0.82rem;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .auth-field input {
            width: 100%; padding: 12px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem; font-family: inherit; outline: none;
        }
        .auth-field input:focus { border-color: var(--border-focus); }
        .auth-field input::placeholder { color: var(--text-muted); }
        .auth-submit {
            width: 100%; padding: 12px;
            background: #ffffff; color: #000000;
            border: none; border-radius: 12px;
            font-size: 0.92rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s; margin-top: 8px;
        }
        .auth-submit:hover { background: #e0e0e0; }
        .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-switch {
            text-align: center; margin-top: 16px;
            font-size: 0.82rem; color: var(--text-muted);
        }
        .auth-switch a {
            color: var(--gold); cursor: pointer; text-decoration: none;
        }
        .auth-switch a:hover { text-decoration: underline; }
        .auth-error {
            background: rgba(255,85,85,0.1);
            border: 1px solid rgba(255,85,85,0.2);
            border-radius: 10px; padding: 10px 14px;
            color: #ff8888; font-size: 0.82rem;
            margin-bottom: 16px; display: none;
        }
        .auth-error.show { display: block; }
        .auth-success {
            background: rgba(100,255,100,0.1);
            border: 1px solid rgba(100,255,100,0.2);
            border-radius: 10px; padding: 10px 14px;
            color: #88ff88; font-size: 0.82rem;
            margin-bottom: 16px; display: none;
        }
        .auth-success.show { display: block; }
        .auth-close {
            position: absolute; top: 12px; right: 16px;
            background: transparent; border: none;
            color: var(--text-muted); font-size: 1.2rem; cursor: pointer;
        }

        /* 图片上传 */
        .image-input-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
        }
        .image-input {
            flex: 1; padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.88rem; font-family: inherit; outline: none;
        }
        .image-input:focus { border-color: var(--border-focus); }
        .image-input::placeholder { color: var(--text-muted); }
        .post-images {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
        }
        .post-image {
            max-width: 100%; max-height: 300px;
            border-radius: 12px; border: 1px solid var(--border);
            object-fit: cover;
        }

        /* 分享按钮 */

        
        /* 烟花 */


        @media (max-width: 600px) {
            .pin-btn {
                opacity: 1;
            }
        }

        .delete-btn {
            background: transparent;
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: rgba(255, 120, 120, 0.7);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .post-card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(255, 80, 80, 0.15);

            color: rgba(255, 150, 150, 1);
        }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>
<div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <header class="header">
        <h1>探索宇宙帖子</h1>
        <p>探索浩瀚宇宙，分享星辰大海，一起畅聊太空奥秘</p>
    </header>

    <!-- 火箭发射时间表 -->
    <div class="launch-section">
        <div class="launch-tabs">
            <button class="launch-tab active" data-launch-tab="upcoming">
                <span>🚀 近期发射</span>
            </button>
            <button class="launch-tab" data-launch-tab="launched">
                <span>🏁 已发射</span>
            </button>
            <div class="launch-controls-wrap" id="launchControlsWrap"></div>
        </div>
        <div class="launch-list" id="launchList"></div>
        <div class="launch-list" id="launchedList" style="display:none;"></div>
    </div>

    <div class="container">

        
        <div class="top-bar">
            <div class="tabs">
                <button class="tab active" data-tab="hot">
                    <span class="icon">🔥</span>热门
                </button>
                <button class="tab" data-tab="new">
                    <span class="icon">🆕</span>最新
                </button>
            </div>
            <div class="auth-area" id="authArea">
                <button class="btn-auth" onclick="openAuthModal()">登录 / 注册</button>
            </div>
            <button class="fab-post" onclick="openModal()">✨ 发布帖子</button>
        </div>

        <div class="posts-list" id="postsList">
            <div class="loading">正在加载帖子...</div>
        </div>
    </div>

    <!-- 发帖弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="modal-title">发布帖子</div>
            <input type="text" class="modal-input" id="modalName" placeholder="你的名字" maxlength="20">
            <input type="text" class="modal-input" id="modalTitle" placeholder="标题" maxlength="50">
            <div class="image-input-row">
                <input type="text" class="image-input" id="modalImage" placeholder="图片链接（可选，粘贴图片URL）" maxlength="500">
            </div>
            <textarea class="modal-textarea" id="modalContent" placeholder="内容" maxlength="1000"></textarea>
            <button class="modal-submit" id="submitBtn" onclick="submitPost()">发布</button>
        </div>
    </div>

    <!-- 发射编辑弹窗 -->
    <div class="modal-overlay" id="launchModalOverlay">
        <div class="modal">
            <button class="modal-close" onclick="closeLaunchEditor()">×</button>
            <div class="modal-title" id="launchModalTitle">添加火箭发射</div>
            <input type="text" class="modal-input" id="launchRocket" placeholder="火箭名称（如：朱雀三号遥二）" maxlength="50">
            <input type="text" class="modal-input" id="launchAgency" placeholder="机构（如：蓝箭航天）" maxlength="50">
            <input type="datetime-local" class="modal-input" id="launchDate" style="color-scheme: dark;">
            <input type="text" class="modal-input" id="launchLocation" placeholder="发射地点" maxlength="100">
            <input type="text" class="modal-input" id="launchMission" placeholder="任务（简短描述）" maxlength="100">
            <input type="text" class="modal-input" id="launchImage" placeholder="图片链接（可选）" maxlength="500">
            <textarea class="modal-textarea" id="launchDesc" placeholder="详细描述（可选）" maxlength="500"></textarea>
            <button class="modal-submit" id="launchSubmitBtn" onclick="submitLaunch()">保存</button>
        </div>
    </div>

    <!-- 用户认证弹窗 -->
    <div class="auth-modal-overlay" id="authModal">
        <div class="auth-modal">
            <h2 id="authTitle">登录</h2>
            <div class="auth-error" id="authError"></div>
            <div class="auth-success" id="authSuccess"></div>
            <div class="auth-field">
                <label>用户名</label>
                <input type="text" id="authUsername" placeholder="起一个用户名" maxlength="20">
            </div>
            <div class="auth-field">
                <label>密码</label>
                <input type="password" id="authPassword" placeholder="密码（至少6位）">
            </div>
            <div class="auth-field" id="authConfirmField" style="display:none">
                <label>确认密码</label>
                <input type="password" id="authConfirm" placeholder="再输入一次密码">
            </div>
            <button class="auth-submit" id="authSubmitBtn" onclick="handleAuth()">登录</button>
            <div class="auth-switch">
                <span id="authSwitchText">还没有账号？</span>
                <a id="authSwitchLink" onclick="toggleAuthMode()">注册</a>
            </div>
            <button class="auth-close" onclick="closeAuthModal()">&times;</button>
        </div>
    </div>

    <script>
        // ==================== Supabase 配置 ====================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==================== 数据 ====================
        let posts = [];
        let currentTab = 'hot';
        let likedPosts = JSON.parse(localStorage.getItem('likedPosts')) || {};
        let isLoading = false;

        // ==================== 官方机构账号配置 ====================
        const OFFICIAL_USERS = {
            'NASA': { avatar: 'https://www.nasa.gov/wp-content/themes/nasa/assets/images/nasa-logo.svg', badge: 'NASA官方' },
            'CNSA': { avatar: 'https://picx.zhimg.com/v2-264f1e06887851be0703902fb9f106ca_r.jpg?source=2c26e567', badge: '国家航天局' },
            'SpaceX': { avatar: 'https://i.imglt.com/20260802/f61b49848b4eda0e49a759683af30679.jpg', badge: 'SpaceX官方' },
            '其他火箭发射': { avatar: 'https://i0.hdslb.com/bfs/new_dyn/43b61571f1e9a172c5ef0e1bc70d709f3461574224251726.jpg', badge: '火箭发射' }
        };
        function isOfficialUser(name) {
            return !!OFFICIAL_USERS[name];
        }

        // ==================== 从云端加载帖子 ====================
        async function loadPosts() {
            isLoading = true;
            try {
                const { data: postData, error: postErr } = await sb.from('posts').select('*').order('time', { ascending: false });
                if (postErr) throw postErr;
                posts = postData || [];
                renderPosts();
                // 加载发射数据
                await loadLaunches();
            } catch (err) {
                console.error('加载失败:', err);
                document.getElementById('postsList').innerHTML = '<div class="empty-state"><div class="emoji">⚠️</div><p>加载失败，请检查网络连接</p></div>';
            }
            isLoading = false;
        }

        // ==================== 加载发射数据 ====================
        async function loadLaunches() {
            try {
                const { data, error } = await sb.from('launches').select('*').order('date', { ascending: true });
                if (error) throw error;
                if (data && data.length > 0) {
                    launches = data;
                    renderLaunches();
                } else {
                    // 首次运行，插入默认数据
                    for (const l of launches) {
                        await sb.from('launches').insert({
                            rocket: l.rocket, agency: l.agency, date: l.date,
                            location: l.location, mission: l.mission,
                            image: l.image || '', desc: l.desc, status: l.status || 'tentative'
                        });
                    }
                }
            } catch (err) {
                console.error('加载发射数据失败:', err);
            }
        }

        // ==================== 更新单个帖子到 Supabase ====================
        async function updatePostDB(postId) {
            const post = posts.find(p => String(p.id) === String(postId));
            if (!post) return;
            try {
                const { error } = await sb.from('posts').update({
                    likes: post.likes || 0,
                    comments: post.comments || [],
                    pinned: post.pinned || false
                }).eq('id', postId);
                if (error) console.error('更新帖子失败:', error);
            } catch (err) {
                console.error('更新帖子失败:', err);
            }
        }

        // ==================== saveLaunches 兼容占位 ====================
        async function saveLaunches() {}

        // ==================== 自动刷新（每1分钟同步一次） ====================
        setInterval(() => {
            if (!isLoading) loadPosts();
        }, 60000);

        // ==================== 模态框 ====================
        function openModal() {
            document.getElementById('modalOverlay').classList.add('show');
            setTimeout(() => {
                document.getElementById('modalName').focus();
            }, 100);
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.getElementById('modalName').value = '';
            document.getElementById('modalTitle').value = '';
            document.getElementById('modalContent').value = '';
            document.getElementById('modalImage').value = '';
            document.getElementById('modalName').readOnly = false;
            document.getElementById('modalName').style.opacity = '1';
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { closeModal(); closeLaunchEditor(); }
        });

        // ==================== 发帖 ====================
        async function submitPost() {
            const name = document.getElementById('modalName').value.trim();
            const title = document.getElementById('modalTitle').value.trim();
            const content = document.getElementById('modalContent').value.trim();

            if (!name) {
                document.getElementById('modalName').focus();
                return;
            }

            if (!title && !content) {
                document.getElementById('modalTitle').focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '发布中...';

            const newPost = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                title: title,
                content: content,
                author: name,
                avatar: getAvatar(name),
                image: document.getElementById('modalImage') ? (document.getElementById('modalImage').value.trim() || '') : '',
                time: Date.now(),
                likes: 0,
                comments: []
            };

            // 插入到 Supabase
            try {
                const { error } = await sb.from('posts').insert({
                    id: newPost.id,
                    title: newPost.title,
                    content: newPost.content,
                    author: newPost.author,
                    avatar: newPost.avatar,
                    image: newPost.image,
                    time: newPost.time,
                    likes: 0,
                    comments: [],
                    pinned: false
                });
                if (error) throw error;
                posts.unshift(newPost);
                closeModal();
                currentTab = 'new';
                updateTabs();
                renderPosts();
            } catch (err) {
                alert('发布失败: ' + err.message);
            }

            btn.disabled = false;
            btn.textContent = '发布';
        }

        // ==================== 点赞 ====================
        async function toggleLike(id) {
            const isLiked = likedPosts[id] || false;

            // 在本地找到帖子并修改
            const post = posts.find(p => p.id === id);
            if (post) {
                post.likes = isLiked ? Math.max(0, (post.likes || 0) - 1) : (post.likes || 0) + 1;
            }

            likedPosts[id] = !isLiked;
            localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
            renderPosts();

            // 同步到 Supabase
            updatePostDB(id);
        }

        // ==================== 渲染 ====================
        function renderPosts() {
            const list = document.getElementById('postsList');
            let displayPosts = [...posts];

            if (currentTab === 'hot') {
                displayPosts.sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return (b.likes || 0) - (a.likes || 0);
                });
            } else {
                displayPosts.sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return (b.time || 0) - (a.time || 0);
                });
            }

            if (displayPosts.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">🚀</div>
                        <p>还没有帖子，点击右上角发布第一条宇宙探索动态吧</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = displayPosts.map(post => {
                const isLiked = likedPosts[post.id] || false;
                return `
                    <div class="post-card" data-id="${post.id}">
                        <div class="post-header">
                            <div class="post-author">
                                <div class="avatar">${post.avatar.startsWith('http') ? `<img src="${post.avatar}" alt="avatar">` : post.avatar}</div>
                                <div class="author-info">
                                    <span class="author-name">
                                        ${escapeHtml(post.author)}
                                        ${OFFICIAL_USERS[post.author] ? `<span class="badge-official">${OFFICIAL_USERS[post.author].badge}</span>` : ''}
                                    </span>
                                    <span class="post-time">${formatTime(post.time)}</span>
                                </div>
                            </div>
                            <div style="display: flex; flex-shrink: 0; gap: 4px;">
                                <button class="pin-btn" onclick="togglePin('${post.id}')" title="置顶/取消置顶">${post.pinned ? '📌 取消置顶' : '📌 置顶'}</button>
                                <button class="delete-btn" onclick="deletePost('${post.id}')" title="删除帖子">🗑 删除</button>
                            </div>
                        </div>
                        ${post.title ? `<div class="post-title">${post.pinned ? '📌 ' : ''}${escapeHtml(post.title)}</div>` : ''}
                        ${post.image ? `<div class='post-images'><img src='${escapeHtml(post.image)}' class='post-image' alt='图片' onerror="this.style.display='none'"></div>` : ''}
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        <div class="post-footer">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                                <span>${isLiked ? '❤️' : '🤍'}</span>
                                <span>${post.likes || 0}</span>
                            </button>
                            <button class="comments-toggle-btn" onclick="toggleComments('${post.id}')">
                                <span>💬</span>
                                <span>${(post.comments && post.comments.length) || 0}</span>
                            </button>
                        </div>
                        <div class="comments-section" id="comments-${post.id}">
                            <div class="comments-list" id="comments-list-${post.id}">
                                ${(post.comments && post.comments.length > 0) ? post.comments.map(c => `
                                    <div class="comment-item">
                                        <div class="comment-avatar">🌟</div>
                                        <div class="comment-body">
                                            <div class="comment-author">${escapeHtml(c.author)}</div>
                                            <div class="comment-text">${escapeHtml(c.content)}</div>
                                            <div class="comment-time">${formatTime(c.time)}</div>
                                        </div>
                                        <button class="action-btn" style="color:#ff5555;font-size:12px;" onclick="deleteComment('${post.id}', '${c.id}')">🗑️</button>
                                    </div>
                                `).join('') : '<div style="color: var(--text-muted); font-size: 0.85rem; padding: 8px 0;">暂无评论，来做第一个评论的人吧</div>'}
                            </div>
                            <div class="comment-input-area">
                                <div class="comment-input-row">
                                    <input type="text" class="comment-input" id="comment-name-${post.id}" placeholder="你的名字" maxlength="20">
                                </div>
                                <textarea class="comment-textarea" id="comment-text-${post.id}" placeholder="写下你的评论..." maxlength="300"></textarea>
                                <button class="comment-submit" onclick="submitComment('${post.id}')">发送评论</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function togglePin(postId) {
            const password = prompt('请输入管理员密码：');
            if (password === null) return;
            if (password !== '1028') {
                alert('密码错误！');
                return;
            }
            const post = posts.find(p => String(p.id) === String(postId));
            if (post) {
                post.pinned = !post.pinned;
                await updatePostDB(postId);
                renderPosts();
                alert(post.pinned ? '📌 已置顶' : '📌 已取消置顶');
            }
        }

        async function deletePost(postId) {
            const password = prompt('请输入删除密码:');
            if (password === null) return;
            if (password !== '1028') {
                alert('密码错误，无法删除！');
                return;
            }
            if (!confirm('确定要删除这条帖子吗？')) return;
            try {
                const { error } = await sb.from('posts').delete().eq('id', postId);
                if (error) throw error;
                posts = posts.filter(p => String(p.id) !== String(postId));
                renderPosts();
                alert('🗑 帖子已删除');
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        // ==================== 评论功能 ====================
        function toggleComments(postId) {
            const section = document.getElementById('comments-' + postId);
            if (section) {
                section.classList.toggle('show');
            }
        }

        async function submitComment(postId) {
            const nameInput = document.getElementById('comment-name-' + postId);
            const textInput = document.getElementById('comment-text-' + postId);
            const name = nameInput.value.trim();
            const content = textInput.value.trim();

            if (!name) {
                nameInput.focus();
                return;
            }
            if (!content) {
                textInput.focus();
                return;
            }

            const post = posts.find(p => String(p.id) === String(postId));
            if (!post) return;

            if (!post.comments) post.comments = [];

            post.comments.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                author: name,
                content: content,
                time: Date.now()
            });

            nameInput.value = '';
            textInput.value = '';

            await updatePostDB(postId);
            renderPosts();

            // 重新展开评论区
            setTimeout(() => {
                const section = document.getElementById('comments-' + postId);
                if (section) section.classList.add('show');
            }, 50);
        }

        async function deleteComment(postId, commentId) {
            const pwd = prompt('请输入删除密码：');
            if (pwd !== '1028') {
                alert('密码错误');
                return;
            }
            const post = posts.find(p => String(p.id) === String(postId));
            if (!post || !post.comments) return;
            post.comments = post.comments.filter(c => String(c.id) !== String(commentId));
            await updatePostDB(postId);
            renderPosts();
            setTimeout(() => {
                const section = document.getElementById('comments-' + postId);
                if (section) section.classList.add('show');
            }, 50);
        }

        // ==================== 工具函数 ====================
        function formatTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const minute = 60 * 1000;
            const hour = 60 * minute;
            const day = 24 * hour;

            if (diff < minute) return '刚刚';
            if (diff < hour) return Math.floor(diff / minute) + '分钟前';
            if (diff < day) return Math.floor(diff / hour) + '小时前';
            if (diff < 7 * day) return Math.floor(diff / day) + '天前';
            return new Date(timestamp).toLocaleDateString('zh-CN');
        }

        function getAvatar(name) {
            if (OFFICIAL_USERS[name]) return OFFICIAL_USERS[name].avatar;
            return '🚀';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tab === currentTab);
            });
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentTab = tab.dataset.tab;
                updateTabs();
                renderPosts();
            });
        });
        // ==================== Supabase 无需心跳保活 ====================


        // ==================== 用户账号系统 ====================
        let currentUser = JSON.parse(localStorage.getItem('space_user')) || null;
        let authMode = 'login';
        let allUsers = [];

        async function loadUsers() {
            try {
                const { data, error } = await sb.from('users').select('*');
                if (error) throw error;
                allUsers = data || [];
            } catch (e) {
                console.error('加载用户失败:', e);
            }
        }

        async function saveUser(user) {
            try {
                const { error } = await sb.from('users').insert({
                    name: user.name,
                    password: user.password,
                    avatar: user.avatar
                });
                if (error) throw error;
            } catch (e) {
                console.error('保存用户失败:', e);
            }
        }

        function renderAuthArea() {
            const area = document.getElementById('authArea');
            if (!area) return;
            if (currentUser) {
                const av = getAvatar(currentUser.name);
                const avHtml = av.startsWith('http') ? `<img src="${av}" alt="avatar">` : av;
                const badge = OFFICIAL_USERS[currentUser.name] ? `<span class="auth-user-badge">${OFFICIAL_USERS[currentUser.name].badge}</span>` : '';
                area.innerHTML = `
                    <div class="auth-user">
                        <div class="auth-avatar-small">${avHtml}</div>
                        <span class="auth-name">${escapeHtml(currentUser.name)}</span>
                        ${badge}
                        <button class="btn-logout" onclick="handleLogout()">退出</button>
                    </div>
                `;
                renderLaunchControls();
            } else {
                area.innerHTML = `<button class="btn-auth" onclick="openAuthModal()">登录 / 注册</button>`;
            }
        }

        function openAuthModal() {
            authMode = 'login';
            updateAuthUI();
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';
            document.getElementById('authConfirm').value = '';
            document.getElementById('authError').classList.remove('show');
            document.getElementById('authSuccess').classList.remove('show');
            document.getElementById('authModal').classList.add('show');
            setTimeout(() => document.getElementById('authUsername').focus(), 100);
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('show');
        }

        function toggleAuthMode() {
            authMode = authMode === 'login' ? 'signup' : 'login';
            updateAuthUI();
            document.getElementById('authError').classList.remove('show');
            document.getElementById('authSuccess').classList.remove('show');
        }

        function updateAuthUI() {
            if (authMode === 'signup') {
                document.getElementById('authTitle').textContent = '注册';
                document.getElementById('authSubmitBtn').textContent = '注册';
                document.getElementById('authSwitchText').textContent = '已有账号？';
                document.getElementById('authSwitchLink').textContent = '登录';
                document.getElementById('authConfirmField').style.display = 'block';
            } else {
                document.getElementById('authTitle').textContent = '登录';
                document.getElementById('authSubmitBtn').textContent = '登录';
                document.getElementById('authSwitchText').textContent = '还没有账号？';
                document.getElementById('authSwitchLink').textContent = '注册';
                document.getElementById('authConfirmField').style.display = 'none';
            }
        }

        async function handleAuth() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            const confirm = document.getElementById('authConfirm').value;
            const errEl = document.getElementById('authError');
            const sucEl = document.getElementById('authSuccess');
            const btn = document.getElementById('authSubmitBtn');

            errEl.classList.remove('show');
            sucEl.classList.remove('show');

            if (!username) { showAuthErr('请输入用户名'); return; }
            if (!password || password.length < 6) { showAuthErr('密码至少6位'); return; }

            btn.disabled = true;
            btn.textContent = '请稍候...';

            await loadUsers();

            if (authMode === 'signup') {
                if (password !== confirm) { showAuthErr('两次密码不一致'); btn.disabled = false; btn.textContent = '注册'; return; }
                const exists = allUsers.find(u => u.name.toLowerCase() === username.toLowerCase());
                if (exists) { showAuthErr('该用户名已被注册'); btn.disabled = false; btn.textContent = '注册'; return; }
                const newUser = { name: username, password: password, avatar: getAvatar(username) };
                allUsers.push(newUser);
                await saveUser(newUser);
                showAuthSuc('注册成功！请登录');
                authMode = 'login';
                updateAuthUI();
                document.getElementById('authPassword').value = '';
                document.getElementById('authConfirm').value = '';
            } else {
                const user = allUsers.find(u => u.name.toLowerCase() === username.toLowerCase());
                if (!user || user.password !== password) { showAuthErr('用户名或密码错误'); btn.disabled = false; btn.textContent = '登录'; return; }
                currentUser = { name: user.name, avatar: user.avatar };
                localStorage.setItem('space_user', JSON.stringify(currentUser));
                closeAuthModal();
                renderAuthArea();
            }

            btn.disabled = false;
            btn.textContent = authMode === 'login' ? '登录' : '注册';
        }

        function showAuthErr(msg) {
            const el = document.getElementById('authError');
            el.textContent = msg; el.classList.add('show');
            document.getElementById('authSuccess').classList.remove('show');
        }

        function showAuthSuc(msg) {
            const el = document.getElementById('authSuccess');
            el.textContent = msg; el.classList.add('show');
            document.getElementById('authError').classList.remove('show');
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('space_user');
            renderAuthArea();
            renderLaunchControls();
        }

        // Override openModal to require login
        const _origOpenModal = openModal;
        openModal = function() {
            if (!currentUser) {
                openAuthModal();
                return;
            }
            _origOpenModal();
            document.getElementById('modalName').value = currentUser.name;
            document.getElementById('modalName').readOnly = true;
            document.getElementById('modalName').style.opacity = '0.6';
            document.getElementById('modalTitle').focus();
        };

        // ==================== 火箭发射时间表 ====================
        let launches = [
            {
                rocket: '朱雀三号遥二',
                agency: '蓝箭航天 LandSpace',
                date: new Date('2026-08-11T10:00:00+08:00').getTime(),
                location: '酒泉东风商业航天区',
                mission: '一子级垂直回收验证',
                desc: '中国民营可重复使用火箭关键测试，朱雀三号遥二将首次挑战陆地着陆腿垂直回收。若成功，中国将成为第二个掌握火箭回收技术的国家。',
                status: 'confirmed'
            },
            {
                rocket: 'Starship IFT-14',
                agency: 'SpaceX',
                date: new Date('2026-08-20T12:00:00+08:00').getTime(),
                location: '德州星际基地 Starbase',
                mission: '第14次试飞 · 尝试塔捕S41',
                desc: 'IFT-13成功部署星链卫星后，SpaceX计划在IFT-14中再次尝试用发射塔机械臂捕获超重型助推器，并验证飞船再入隔热盾改进效果。',
                status: 'tentative'
            },
            {
                rocket: 'Artemis II',
                agency: 'NASA',
                date: new Date('2026-09-30T00:00:00+08:00').getTime(),
                location: '肯尼迪航天中心 KSC',
                mission: '载人绕月飞行测试',
                desc: '自1972年阿波罗17号以来人类首次载人深空飞行，四名宇航员将乘坐猎户座飞船绕月飞行，为阿尔忒弥斯三号登月铺路。',
                status: 'tentative'
            }
        ];

        let currentLaunchTab = 'upcoming';

        function renderLaunches() {
            const list = document.getElementById('launchList');
            const launchedList = document.getElementById('launchedList');
            if (!list) return;
            const now = Date.now();

            // 分离即将发射和已发射
            const upcoming = [];
            const launched = [];
            launches.forEach((l, i) => {
                if (l.date - now <= 0) {
                    launched.push({ data: l, origIndex: i });
                } else {
                    upcoming.push({ data: l, origIndex: i });
                }
            });

            // 已发射按时间倒序，只保留前20个
            launched.sort((a, b) => b.data.date - a.data.date);
            if (launched.length > 20) {
                const toRemove = launched.slice(20);
                for (const item of toRemove) {
                    if (item.data.id) {
                        await sb.from('launches').delete().eq('id', item.data.id);
                    }
                    const idx = launches.indexOf(item.data);
                    if (idx !== -1) launches.splice(idx, 1);
                }
                launched.length = 20;
            }

            // 渲染即将发射
            list.innerHTML = upcoming.length > 0 ? upcoming.map((item) => {
                const l = item.data;
                const i = item.origIndex;
                const diff = l.date - now;

                let badgeClass = 'badge-upcoming';
                let badgeText = '即将发射';
                if (l.status === 'tentative') {
                    badgeClass = 'badge-tentative';
                    badgeText = '待定';
                }
                if (diff > 0 && diff < 3 * 24 * 60 * 60 * 1000) {
                    badgeClass = 'badge-soon';
                    badgeText = '发射在即';
                }

                const dateStr = new Date(l.date).toLocaleString('zh-CN', {
                    month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                const days = Math.floor(diff / (24 * 60 * 60 * 1000));
                const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                const mins = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
                const secs = Math.floor((diff % (60 * 1000)) / 1000);
                const countdownHtml = `
                    <div class="launch-countdown">
                        <div class="countdown-box">
                            <div class="countdown-num" id="cd-days-${i}">${days}</div>
                            <div class="countdown-label">天</div>
                        </div>
                        <div class="countdown-box">
                            <div class="countdown-num" id="cd-hours-${i}">${String(hours).padStart(2,'0')}</div>
                            <div class="countdown-label">时</div>
                        </div>
                        <div class="countdown-box">
                            <div class="countdown-num" id="cd-mins-${i}">${String(mins).padStart(2,'0')}</div>
                            <div class="countdown-label">分</div>
                        </div>
                        <div class="countdown-box">
                            <div class="countdown-num" id="cd-secs-${i}">${String(secs).padStart(2,'0')}</div>
                            <div class="countdown-label">秒</div>
                        </div>
                    </div>
                `;

                return `
                    <div class="launch-card ${diff > 0 && diff < 3 * 24 * 60 * 60 * 1000 ? 'launching-soon' : ''}">
                        <div class="launch-card-top">
                            <div class="launch-info">
                                <div class="launch-rocket">${l.rocket}</div>
                                <div class="launch-agency">${l.agency}</div>
                                <div class="launch-meta">
                                    <span>📅 ${dateStr}</span>
                                    <span>📍 ${l.location}</span>
                                    <span>🎯 ${l.mission}</span>
                                </div>
                            </div>
                            <span class="launch-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        ${countdownHtml}
                        ${l.image ? `<img src="${escapeHtml(l.image)}" class="launch-image" alt="发射图片" onerror="this.style.display='none'">` : ''}
                        <div class="launch-desc">${escapeHtml(l.desc)}</div>
                        ${currentUser && isOfficialUser(currentUser.name) ? `
                        <div class="launch-card-actions">
                            <button class="launch-edit-btn" onclick="editLaunch(${i})">✏️ 编辑</button>
                            <button class="launch-delete-btn" onclick="deleteLaunch(${i})">🗑 删除</button>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('') : '<div class="empty-state"><div class="emoji">🚀</div><p>暂无即将发射的火箭</p></div>';

            // 渲染已发射
            if (launchedList) {
                launchedList.innerHTML = launched.length > 0 ? launched.map((item) => {
                    const l = item.data;
                    const i = item.origIndex;
                    const dateStr = new Date(l.date).toLocaleString('zh-CN', {
                        month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                    const ago = Date.now() - l.date;
                    const agoDays = Math.floor(ago / (24 * 60 * 60 * 1000));
                    const agoHours = Math.floor((ago % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                    const agoMins = Math.floor((ago % (60 * 60 * 1000)) / (60 * 1000));
                    let agoStr = '';
                    if (agoDays > 0) agoStr = `${agoDays}天${agoHours}小时前`;
                    else if (agoHours > 0) agoStr = `${agoHours}小时${agoMins}分钟前`;
                    else agoStr = `${agoMins}分钟前`;

                    return `
                        <div class="launch-card launched-card">
                            <div class="launch-card-top">
                                <div class="launch-info">
                                    <div class="launch-rocket">${l.rocket}</div>
                                    <div class="launch-agency">${l.agency}</div>
                                    <div class="launch-meta">
                                        <span>📅 ${dateStr}</span>
                                        <span>📍 ${l.location}</span>
                                        <span>🎯 ${l.mission}</span>
                                    </div>
                                </div>
                                <span class="launch-badge badge-launched">已发射</span>
                            </div>
                            <div class="launched-time">🚀 发射于 <strong>${agoStr}</strong></div>
                            ${l.image ? `<img src="${escapeHtml(l.image)}" class="launch-image" alt="发射图片" onerror="this.style.display='none'">` : ''}
                            <div class="launch-desc">${escapeHtml(l.desc)}</div>
                            ${currentUser && isOfficialUser(currentUser.name) ? `
                            <div class="launch-card-actions">
                                <button class="launch-edit-btn" onclick="editLaunch(${i})">✏️ 编辑</button>
                                <button class="launch-delete-btn" onclick="deleteLaunch(${i})">🗑 删除</button>
                            </div>
                            ` : ''}
                        </div>
                    `;
                }).join('') : '<div class="empty-state"><div class="emoji">🏁</div><p>暂无已发射的火箭</p></div>';
            }
        }

        // Tab 切换
        function updateLaunchTabs() {
            document.querySelectorAll('.launch-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.launchTab === currentLaunchTab);
            });
            const list = document.getElementById('launchList');
            const launchedList = document.getElementById('launchedList');
            if (list) list.style.display = currentLaunchTab === 'upcoming' ? '' : 'none';
            if (launchedList) launchedList.style.display = currentLaunchTab === 'launched' ? '' : 'none';
        }

        document.querySelectorAll('.launch-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentLaunchTab = tab.dataset.launchTab;
                updateLaunchTabs();
            });
        });

        function updateCountdowns() {
            const now = Date.now();
            let needRerender = false;

            launches.forEach((l, i) => {
                const diff = l.date - now;
                if (diff <= 0) {
                    needRerender = true;
                    return;
                }

                const days = Math.floor(diff / (24 * 60 * 60 * 1000));
                const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                const mins = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
                const secs = Math.floor((diff % (60 * 1000)) / 1000);

                const dEl = document.getElementById('cd-days-' + i);
                const hEl = document.getElementById('cd-hours-' + i);
                const mEl = document.getElementById('cd-mins-' + i);
                const sEl = document.getElementById('cd-secs-' + i);

                if (dEl) dEl.textContent = days;
                if (hEl) hEl.textContent = String(hours).padStart(2, '0');
                if (mEl) mEl.textContent = String(mins).padStart(2, '0');
                if (sEl) sEl.textContent = String(secs).padStart(2, '0');
            });

            if (needRerender) renderLaunches();
        }

        // ==================== 发射管理控件 ====================
        function renderLaunchControls() {
            const wrap = document.getElementById('launchControlsWrap');
            if (!wrap) return;
            wrap.innerHTML = '';

            if (currentUser && isOfficialUser(currentUser.name)) {
                wrap.innerHTML = '<button class="btn-add-launch" onclick="openLaunchEditor()">+ 添加发射</button>';
            }
        }

        // ==================== 发射编辑器 ====================
        let editingLaunchId = null;

        function openLaunchEditor() {
            editingLaunchId = null;
            document.getElementById('launchRocket').value = '';
            document.getElementById('launchAgency').value = '';
            document.getElementById('launchDate').value = '';
            document.getElementById('launchLocation').value = '';
            document.getElementById('launchMission').value = '';
            document.getElementById('launchImage').value = '';
            document.getElementById('launchDesc').value = '';
            document.getElementById('launchModalTitle').textContent = '添加火箭发射';
            document.getElementById('launchModalOverlay').classList.add('show');
            setTimeout(() => document.getElementById('launchRocket').focus(), 100);
        }

        function closeLaunchEditor() {
            document.getElementById('launchModalOverlay').classList.remove('show');
            editingLaunchId = null;
        }

        function editLaunch(index) {
            const l = launches[index];
            if (!l) return;
            editingLaunchId = index;

            // 转换时间为 datetime-local 格式
            const d = new Date(l.date);
            const localISO = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

            document.getElementById('launchRocket').value = l.rocket || '';
            document.getElementById('launchAgency').value = l.agency || '';
            document.getElementById('launchDate').value = localISO;
            document.getElementById('launchLocation').value = l.location || '';
            document.getElementById('launchMission').value = l.mission || '';
            document.getElementById('launchImage').value = l.image || '';
            document.getElementById('launchDesc').value = l.desc || '';
            document.getElementById('launchModalTitle').textContent = '编辑火箭发射';
            document.getElementById('launchModalOverlay').classList.add('show');
        }

        async function submitLaunch() {
            if (!currentUser || !isOfficialUser(currentUser.name)) {
                alert('只有官方机构账号才能管理发射时间表');
                return;
            }

            const rocket = document.getElementById('launchRocket').value.trim();
            const agency = document.getElementById('launchAgency').value.trim();
            const dateStr = document.getElementById('launchDate').value;
            const location = document.getElementById('launchLocation').value.trim();
            const mission = document.getElementById('launchMission').value.trim();
            const image = document.getElementById('launchImage').value.trim();
            const desc = document.getElementById('launchDesc').value.trim();

            if (!rocket) { document.getElementById('launchRocket').focus(); return; }
            if (!dateStr) { document.getElementById('launchDate').focus(); return; }

            const btn = document.getElementById('launchSubmitBtn');
            btn.disabled = true;
            btn.textContent = '保存中...';

            const launchData = {
                rocket: rocket,
                agency: agency,
                date: new Date(dateStr).getTime(),
                location: location,
                mission: mission,
                image: image,
                desc: desc,
                status: 'tentative'
            };

            if (editingLaunchId !== null) {
                // 更新现有发射记录
                const existing = launches[editingLaunchId];
                const dbId = existing.id;
                const { error } = await sb.from('launches').update({
                    rocket: rocket, agency: agency, date: launchData.date,
                    location: location, mission: mission, image: image,
                    desc: desc, status: 'tentative'
                }).eq('id', dbId);
                if (error) { alert('保存失败: ' + error.message); btn.disabled = false; btn.textContent = '保存'; return; }
                launches[editingLaunchId] = { ...launchData, id: dbId };
            } else {
                // 新增发射记录
                const { data: inserted, error } = await sb.from('launches').insert({
                    rocket: rocket, agency: agency, date: launchData.date,
                    location: location, mission: mission, image: image,
                    desc: desc, status: 'tentative'
                }).select();
                if (error) { alert('保存失败: ' + error.message); btn.disabled = false; btn.textContent = '保存'; return; }
                if (inserted && inserted[0]) launches.push(inserted[0]);
            }

            // 按日期排序
            launches.sort((a, b) => a.date - b.date);

            renderLaunches();

            btn.disabled = false;
            btn.textContent = '保存';
            closeLaunchEditor();
        }

        async function deleteLaunch(index) {
            if (!currentUser || !isOfficialUser(currentUser.name)) return;
            if (!confirm('确定要删除这条发射信息吗？')) return;
            const launch = launches[index];
            if (launch && launch.id) {
                const { error } = await sb.from('launches').delete().eq('id', launch.id);
                if (error) { alert('删除失败: ' + error.message); return; }
            }
            launches.splice(index, 1);
            renderLaunches();
        }

        renderLaunches();
        renderLaunchControls();
        setInterval(updateCountdowns, 1000);

// ==================== 初始化 ====================
        // launchModalOverlay 在 script 之后渲染，这里绑定事件
        var lmo = document.getElementById('launchModalOverlay');
        if (lmo) lmo.addEventListener('click', function(e) {
            if (e.target === this) closeLaunchEditor();
        });
        renderAuthArea();
        loadUsers();
        loadPosts();
    
    

</script>

</body>
</html>
