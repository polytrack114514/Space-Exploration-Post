// ============================================
// 通知系统 & 私信系统 - 太空探索帖子网站
// ============================================
//
// 依赖全局变量：
//   sb          - Supabase 客户端实例 (supabase.createClient)
//   currentUser - 当前登录用户对象 (有 .name 属性)
//   posts       - 帖点数组
//   allUsers    - 所有用户数组
//
// 依赖已有函数：
//   escapeHtml(str)        - HTML 转义
//   formatTime(timestamp)  - 时间格式化
//   getAvatar(username)    - 获取头像 (返回 URL 或 emoji)
//   openAuthModal()        - 打开登录弹窗
//   closeProfileModal()    - 关闭用户主页弹窗
//   showUserProfile(name)  - 显示用户主页
//   toggleComments(postId) - 切换帖子评论区
//
// 数据库表：
//   notifications(id, target_user, from_user, type, post_id, content, is_read, created_at)
//   messages(id, from_user, to_user, content, is_read, created_at)
//
// 弹窗显示规则：modal 元素添加 class="show" 时显示 (display:flex)
// 所需 DOM 元素 ID：
//   通知：notifyBadge, notifyModal, notifyList

// ============================================

// ===== 全局变量 =====

// 通知系统
let notifications = [];

// 定时器 ID
let _notifyMsgIntervalId = null;

// ============================================
// 通知系统
// ============================================

/**
 * 加载当前用户的通知（最多 50 条，按时间倒序）
 */
async function loadNotifications() {
    if (!currentUser) return;
    try {
        const { data, error } = await sb.from('notifications')
            .select('*')
            .eq('target_user', currentUser.name)
            .order('created_at', { ascending: false })
            .limit(50);
        if (error) throw error;
        notifications = data || [];
        updateNotifyBadge();
    } catch (e) {
        console.error('加载通知失败:', e);
    }
}

/**
 * 更新通知徽章（未读数）
 */
function updateNotifyBadge() {
    const unread = notifications.filter(function (n) { return !n.is_read; }).length;
    const badge = document.getElementById('notifyBadge');
    if (badge) {
        badge.textContent = unread > 99 ? '99+' : unread;
        badge.style.display = unread > 0 ? 'flex' : 'none';
    }
}

/**
 * 打开通知弹窗并标记已读
 */
function openNotifyModal() {
    if (!currentUser) { openAuthModal(); return; }
    const modal = document.getElementById('notifyModal');
    if (modal) {
        modal.classList.add('show');
        renderNotifications();
        // 标记所有为已读
        markAllNotificationsRead();
    }
}

/**
 * 关闭通知弹窗
 */
function closeNotifyModal() {
    const modal = document.getElementById('notifyModal');
    if (modal) modal.classList.remove('show');
}

/**
 * 处理通知点击事件
 * - 如果帖子存在，跳转到帖子并展开评论
 * - 如果帖子已删除，仅关闭弹窗
 * - 如果是关注通知（无 post_id），跳转到用户主页
 * @param {number} index - 通知在 notifications 数组中的索引
 */
function handleNotificationClick(index) {
    var n = notifications[index];
    if (!n) return;
    closeNotifyModal();
    if (n.post_id) {
        // 检查帖子是否仍然存在
        var post = null;
        if (typeof posts !== 'undefined' && Array.isArray(posts)) {
            post = posts.find(function (p) { return String(p.id) === String(n.post_id); });
        }
        if (post && typeof toggleComments === 'function') {
            toggleComments(n.post_id);
        }
        // 帖子已删除则不做跳转，仅关闭弹窗
    }
}

/**
 * 删除单条通知
 * @param {number} index - 通知索引
 * @param {Event} event - 事件对象（阻止冒泡）
 */
async function deleteNotification(index, event) {
    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }
    var n = notifications[index];
    if (!n) return;
    try {
        var { error } = await sb.from('notifications').delete().eq('id', n.id);
        if (error) throw error;
        notifications.splice(index, 1);
        updateNotifyBadge();
        renderNotifications();
    } catch (e) {
        console.error('删除通知失败:', e);
    }
}

/**
 * 渲染通知列表
 * 使用 index 索引方式绑定点击事件，避免字符串转义问题
 */
function renderNotifications() {
    var list = document.getElementById('notifyList');
    if (!list) return;

    if (notifications.length === 0) {
        list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">暂无通知</div>';
        return;
    }

    var iconMap = { 'like': '❤️', 'comment': '💬', 'follow': '👥' };

    list.innerHTML = notifications.map(function (n, index) {
        var icon = iconMap[n.type] || '🔔';
        var timeStr = formatTime(n.created_at);

        var html = '';
        html += '<div class="notification-item' + (n.is_read ? '' : ' unread') + '"';
        html += ' onclick="handleNotificationClick(' + index + ')"';
        html += ' style="cursor:pointer;">';
        html +=   '<div class="notification-icon">' + icon + '</div>';
        html +=   '<div class="notification-content">';
        html +=     '<div class="notification-text">' + escapeHtml(n.content) + '</div>';
        html +=     '<div class="notification-time">' + timeStr + '</div>';
        html +=   '</div>';
        html +=   '<button class="notification-delete-btn"';
        html +=     ' onclick="deleteNotification(' + index + ', event)"';
        html +=     ' title="删除该通知"';
        html +=     ' style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.9rem;padding:4px 8px;opacity:0.6;flex-shrink:0;"';
        html +=     ' onmouseover="this.style.opacity=1"';
        html +=     ' onmouseout="this.style.opacity=0.6">✕</button>';
        html += '</div>';
        return html;
    }).join('');
}

/**
 * 标记所有未读通知为已读
 */
async function markAllNotificationsRead() {
    if (!currentUser || notifications.length === 0) return;
    var unreadIds = notifications.filter(function (n) { return !n.is_read; }).map(function (n) { return n.id; });
    if (unreadIds.length === 0) return;
    try {
        var { error } = await sb.from('notifications')
            .update({ is_read: true })
            .in('id', unreadIds);
        if (error) throw error;
        notifications.forEach(function (n) { n.is_read = true; });
        updateNotifyBadge();
    } catch (e) {
        console.error('标记已读失败:', e);
    }
}

/**
 * 创建通知（不会给自己发通知）
 * @param {string} targetUser - 通知接收者用户名
 * @param {string} fromUser   - 通知发起者用户名
 * @param {string} type       - 通知类型: 'like' | 'comment' | 'follow'
 * @param {string|null} postId - 相关帖子 ID（可选）
 * @param {string} content    - 通知内容
 */
async function addNotification(targetUser, fromUser, type, postId, content) {
    if (!targetUser || !fromUser || targetUser === fromUser) return;
    try {
        var { error } = await sb.from('notifications').insert({
            target_user: targetUser,
            from_user: fromUser,
            type: type,
            post_id: postId || null,
            content: content,
            is_read: false,
            created_at: Date.now()
        });
        if (error) throw error;
    } catch (e) {
        console.error('创建通知失败:', e);
    }
}

// ============================================

// ============================================
// 定时刷新 & 初始化
// ============================================

/**
 * 手动刷新通知和未读私信数
 */
async function refreshNotifyAndMessages() {
    if (!currentUser) return;
    try {
        await loadNotifications();
        updateNotifyBadge();
    } catch (e) {
        console.error('刷新通知和私信失败:', e);
    }
}

/**
 * 初始化通知和私信系统
 * 在页面加载完成或用户登录成功后调用
 * 每 30 秒自动刷新通知和未读私信数
 */
function initNotifyMessageSystem() {
    // 立即加载一次
    if (currentUser) {
        loadNotifications();
    }

    // 清除旧的定时器（防止重复初始化）
    if (_notifyMsgIntervalId) {
        clearInterval(_notifyMsgIntervalId);
    }

    // 每 30 秒定时刷新
    _notifyMsgIntervalId = setInterval(function () {
        if (currentUser) {
            loadNotifications();
        }
    }, 30000);
}

/**
 * 停止通知和私信定时刷新
 * 在用户登出时调用
 */
function stopNotifyMessageSystem() {
    if (_notifyMsgIntervalId) {
        clearInterval(_notifyMsgIntervalId);
        _notifyMsgIntervalId = null;
    }
    // 清空状态
    notifications = [];
    updateNotifyBadge();
}

// 太空探索帖子网站 - 收藏/视频嵌入/发射结果记录功能
// 数据库: Supabase (客户端变量: sb)
// 全局变量: currentUser, posts, launches, isOfficialUser, OFFICIAL_USERS

// ==================== 视频嵌入功能 ====================

function getVideoEmbed(text) {
    if (!text) return '';
    var url = '';

    // YouTube 链接检测
    // 格式: https://www.youtube.com/watch?v=VIDEO_ID 或 https://youtu.be/VIDEO_ID
    var ytMatch = text.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (ytMatch) {
        var videoId = ytMatch[1];
        return '<div class="video-embed"><iframe src="https://www.youtube.com/embed/' + videoId + '?autoplay=0&rel=0" allowfullscreen allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>';
    }

    // B站链接检测
    // 格式: https://www.bilibili.com/video/BVxxxxxx 或 https://b23.tv/xxxxxx
    var biliMatch = text.match(/(?:https?:\/\/)?(?:www\.)?(?:bilibili\.com\/video\/|b23\.tv\/)([a-zA-Z0-9]+)/);
    if (biliMatch) {
        var bvid = biliMatch[1];
        // 对于b23.tv短链接，无法直接获取BVID，使用外链跳转
        if (bvid.length <= 8) {
            // b23.tv 短链接，使用跳转
            return '<div class="video-embed" style="display:flex;align-items:center;justify-content:center;background:var(--bg-tertiary);padding:20px;"><a href="https://b23.tv/' + bvid + '" target="_blank" style="color:var(--accent-color);font-size:0.9rem;">📹 点击观看B站视频</a></div>';
        }
        // 提取BV号
        var bvId = bvid.startsWith('BV') ? bvid : 'BV' + bvid;
        return '<div class="video-embed"><iframe src="https://player.bilibili.com/player.html?bvid=' + bvId + '&page=1&high_quality=1&autoplay=0" allowfullscreen allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"></iframe></div>';
    }

    return '';
}

// 检查帖子是否包含视频链接，返回嵌入HTML
function getPostVideoHtml(post) {
    // 检查图片字段和内容字段
    var fromImage = getVideoEmbed(post.image);
    if (fromImage) return fromImage;
    var fromContent = getVideoEmbed(post.content);
    if (fromContent) return fromContent;
    var fromSource = getVideoEmbed(post.source_url);
    if (fromSource) return fromSource;
    return '';
}

// 判断帖子是否包含视频（用于决定是否隐藏图片显示）
function hasVideoUrl(post) {
    return !!(getVideoEmbed(post.image) || getVideoEmbed(post.content) || getVideoEmbed(post.source_url));
}

// ==================== 发射结果记录功能 ====================

// 标记发射结果
async function markLaunchResult(index, result) {
    if (!currentUser || !isOfficialUser(currentUser.name)) {
        alert('只有官方机构账号才能标记发射结果');
        return;
    }
    var launch = launches[index];
    if (!launch || !launch.id) return;

    // 切换：如果已是这个结果，则取消标记回到pending
    var newResult = launch.result === result ? 'pending' : result;

    try {
        const { error } = await sb.from('launches')
            .update({ result: newResult })
            .eq('id', launch.id);
        if (error) throw error;
        launch.result = newResult;
        renderLaunches();
    } catch(e) {
        console.error('标记发射结果失败:', e);
        alert('标记失败: ' + e.message);
    }
}

// 获取发射结果徽章HTML
function getLaunchResultBadge(result) {
    if (!result || result === 'pending') return '';
    var resultMap = {
        'success': { text: '✅ 发射成功', class: 'launch-result-success' },
        'failure': { text: '❌ 发射失败', class: 'launch-result-fail' },
        'partial': { text: '⚠️ 部分成功', class: 'launch-result-partial' }
    };
    var info = resultMap[result];
    if (!info) return '';
    return '<span class="launch-result-badge ' + info.class + '">' + info.text + '</span>';
}

// 获取发射结果操作按钮HTML（仅官方账号可见）
function getLaunchResultActions(index, isLaunched) {
    if (!currentUser || !isOfficialUser(currentUser.name) || !isLaunched) return '';
    var launch = launches[index];
    if (!launch) return '';
    var currentResult = launch.result || 'pending';
    return '<div class="launch-result-actions">' +
        '<button class="launch-result-btn' + (currentResult === 'success' ? ' active' : '') + '" onclick="markLaunchResult(' + index + ', \'success\')" style="' + (currentResult === 'success' ? 'background:rgba(34,197,94,0.2);color:#22c55e;border-color:#22c55e;' : '') + '">✅ 成功</button>' +
        '<button class="launch-result-btn' + (currentResult === 'partial' ? ' active' : '') + '" onclick="markLaunchResult(' + index + ', \'partial\')" style="' + (currentResult === 'partial' ? 'background:rgba(245,158,11,0.2);color:#f59e0b;border-color:#f59e0b;' : '') + '">⚠️ 部分</button>' +
        '<button class="launch-result-btn' + (currentResult === 'failure' ? ' active' : '') + '" onclick="markLaunchResult(' + index + ', \'failure\')" style="' + (currentResult === 'failure' ? 'background:rgba(239,68,68,0.2);color:#ef4444;border-color:#ef4444;' : '') + '">❌ 失败</button>' +
        '</div>';
}

// 获取发射统计HTML
function getLaunchStatsHtml() {
    var successCount = 0, failCount = 0, partialCount = 0, pendingCount = 0;
    var now = Date.now();
    launches.forEach(function(l) {
        if (l.status === 'tbd') return;
        if (l.date && l.date < now) {
            var r = l.result || 'pending';
            if (r === 'success') successCount++;
            else if (r === 'failure') failCount++;
            else if (r === 'partial') partialCount++;
            else pendingCount++;
        }
    });
    var total = successCount + failCount + partialCount;
    if (total === 0 && pendingCount === 0) return '';
    return '<div class="launch-stats">' +
        '<div class="launch-stat-item"><span class="launch-stat-num" style="color:#22c55e;">' + successCount + '</span><span class="launch-stat-label">成功</span></div>' +
        '<div class="launch-stat-item"><span class="launch-stat-num" style="color:#f59e0b;">' + partialCount + '</span><span class="launch-stat-label">部分成功</span></div>' +
        '<div class="launch-stat-item"><span class="launch-stat-num" style="color:#ef4444;">' + failCount + '</span><span class="launch-stat-label">失败</span></div>' +
        '<div class="launch-stat-item"><span class="launch-stat-num" style="color:var(--text-muted);">' + pendingCount + '</span><span class="launch-stat-label">待定</span></div>' +
        '</div>';
}

function initWarpSpeed() {
    var canvas = document.getElementById('warpCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var w = canvas.width = window.innerWidth;
    var h = canvas.height = window.innerHeight;
    var cx = w / 2;
    var cy = h / 2;
    var stars = [];
    var numStars = 300;
    var speed = 2;
    var maxSpeed = 25;

    for (var i = 0; i < numStars; i++) {
        stars.push({
            x: (Math.random() - 0.5) * w,
            y: (Math.random() - 0.5) * h,
            z: Math.random() * w
        });
    }

    var animationId = null;
    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fillRect(0, 0, w, h);

        if (speed < maxSpeed) speed += 0.15;

        for (var i = 0; i < numStars; i++) {
            var star = stars[i];
            star.z -= speed;
            if (star.z <= 0) {
                star.x = (Math.random() - 0.5) * w;
                star.y = (Math.random() - 0.5) * h;
                star.z = w;
            }
            var sx = (star.x / star.z) * w + cx;
            var sy = (star.y / star.z) * h + cy;
            if (sx < 0 || sx > w || sy < 0 || sy > h) continue;

            var size = (1 - star.z / w) * 3;
            var opacity = 1 - star.z / w;
            var prevZ = star.z + speed;
            var psx = (star.x / prevZ) * w + cx;
            var psy = (star.y / prevZ) * h + cy;

            var dist = Math.sqrt((sx - psx) * (sx - psx) + (sy - psy) * (sy - psy));
            if (dist > 1) {
                ctx.strokeStyle = 'rgba(' + Math.floor(91 + opacity * 100) + ',' + Math.floor(155 + opacity * 50) + ',' + Math.floor(245) + ',' + opacity + ')';
                ctx.lineWidth = size;
                ctx.beginPath();
                ctx.moveTo(psx, psy);
                ctx.lineTo(sx, sy);
                ctx.stroke();
            } else {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + opacity + ')';
                ctx.beginPath();
                ctx.arc(sx, sy, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        animationId = requestAnimationFrame(draw);
    }
    draw();

    window.addEventListener('resize', function() {

// ==================== 背景星空动画 ====================
(function() {
    var canvas = document.getElementById('starField');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var stars = [];
    var numStars = 80;
    var w, h;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    for (var i = 0; i < numStars; i++) {
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * 1.5 + 0.3,
            speed: Math.random() * 0.15 + 0.05,
            opacity: Math.random() * 0.5 + 0.2,
            twinkle: Math.random() * Math.PI * 2
        });
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < numStars; i++) {
            var s = stars[i];
            s.y += s.speed;
            if (s.y > h) {
                s.y = 0;
                s.x = Math.random() * w;
            }
            s.twinkle += 0.02;
            var tw = Math.sin(s.twinkle) * 0.3 + 0.7;
            ctx.fillStyle = 'rgba(0, 212, 255, ' + (s.opacity * tw) + ')';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    draw();
})();

async function loadAPOD() {
    var container = document.getElementById('apodContainer');
    if (!container) return;
    try {
        var today = new Date().toISOString().split('T')[0];
        var cacheKey = 'apod_' + today;
        var cached = localStorage.getItem(cacheKey);
        if (cached) {
            renderAPOD(JSON.parse(cached));
            return;
        }
        container.innerHTML = '<div class="apod-container"><div class="apod-loading">📡 正在获取今日天文图片...</div></div>';
        var resp = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&thumbs=true');
        if (!resp.ok) throw new Error('APOD fetch failed');
        var data = await resp.json();
        localStorage.setItem(cacheKey, JSON.stringify(data));
        renderAPOD(data);
    } catch (e) {
        console.error('APOD error:', e);
        container.innerHTML = '';
    }
}
function renderAPOD(data) {
    var container = document.getElementById('apodContainer');
    if (!container || !data) return;
    var imgUrl = data.thumbnail_url || data.url || data.hdurl || '';
    var isVideo = data.media_type === 'video';
    var html = '<div class="apod-container">';
    html += '<div class="apod-header">';
    html += '<span class="apod-badge">NASA APOD</span>';
    html += '<span class="apod-title">每日天文一图</span>';
    html += '</div>';
    html += '<div class="apod-body">';
    if (isVideo) {
        html += '<div class="apod-image-wrap"><a href="' + (data.url||'') + '" target="_blank"><img src="' + (data.thumbnail_url||'') + '" alt="APOD"></a></div>';
    } else {
        html += '<div class="apod-image-wrap"><img src="' + imgUrl + '" alt="' + escapeHtml(data.title||'') + '" onerror="this.style.display=\'none\'"></div>';
    }
    html += '<div class="apod-info">';
    html += '<div class="apod-date">' + escapeHtml(data.date||'') + '</div>';
    html += '<h3>' + escapeHtml(data.title||'') + '</h3>';
    var desc = (data.explanation||'').substring(0, 300);
    if ((data.explanation||'').length > 300) desc += '...';
    html += '<p>' + escapeHtml(desc) + '</p>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
    container.innerHTML = html;
}

function calcPlanetPos(planet, date) {
    var J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
    var d = (date.getTime() - J2000) / 86400000;
    var elements = {
        mercury: { a: 0.387098, e: 0.205635, L0: 252.251, w: 77.456, T: 87.969 },
        venus:   { a: 0.723330, e: 0.006773, L0: 181.979, w: 131.533, T: 224.701 },
        earth:   { a: 1.000001, e: 0.016709, L0: 100.464, w: 102.937, T: 365.256 },
        mars:    { a: 1.523688, e: 0.093405, L0: 355.453, w: 336.040, T: 686.980 },
        jupiter: { a: 5.202561, e: 0.048498, L0: 34.396,  w: 14.728,  T: 4332.589 },
        saturn:  { a: 9.554747, e: 0.055546, L0: 49.954,  w: 92.598,  T: 10759.22 }
    };
    var el = elements[planet];
    if (!el) return null;
    var L = (el.L0 + (360.0 / el.T) * d) % 360;
    if (L < 0) L += 360;
    var M = (L - el.w) * Math.PI / 180;
    var E = M;
    for (var i = 0; i < 6; i++) { E = M + el.e * Math.sin(E); }
    var v = 2 * Math.atan2(Math.sqrt(1 + el.e) * Math.sin(E / 2), Math.sqrt(1 - el.e) * Math.cos(E / 2));
    var r = el.a * (1 - el.e * Math.cos(E));
    var wRad = el.w * Math.PI / 180;
    var x = r * Math.cos(v + wRad);
    var y = r * Math.sin(v + wRad);
    return { x: x, y: y, r: r, angle: Math.atan2(y, x) };
}
function renderSolarSystem() {
    var planets = [
        { key: 'mercury', name: '水星', color: '#8c8c8c', size: 3, au: 0.387 },
        { key: 'venus',   name: '金星', color: '#e8c870', size: 4, au: 0.723 },
        { key: 'earth',   name: '地球', color: '#4080ff', size: 4, au: 1.000 },
        { key: 'mars',    name: '火星', color: '#ff4040', size: 3, au: 1.524 },
        { key: 'jupiter', name: '木星', color: '#d0a060', size: 6, au: 5.203 },
        { key: 'saturn',  name: '土星', color: '#e0c080', size: 5, au: 9.555 }
    ];
    var now = new Date();
    var centerX = 200, centerY = 200, maxRadius = 170, maxAU = 9.555;
    var scaleAU = function(au) { return Math.log(au + 1) / Math.log(maxAU + 1) * maxRadius; };
    var html = '<svg viewBox="0 0 400 400" style="width:100%;max-width:420px;margin:0 auto;display:block;">';
    html += '<defs><filter id="planetGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
    html += '<radialGradient id="sunGrad"><stop offset="0%" stop-color="#ffff00"/><stop offset="60%" stop-color="#ffd700"/><stop offset="100%" stop-color="#ff8c00"/></radialGradient></defs>';
    for (var i = 0; i < planets.length; i++) {
        var r = scaleAU(planets[i].au);
        html += '<circle cx="' + centerX + '" cy="' + centerY + '" r="' + r.toFixed(1) + '" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="0.5" stroke-dasharray="2,2"/>';
    }
    html += '<circle cx="' + centerX + '" cy="' + centerY + '" r="8" fill="url(#sunGrad)" filter="url(#planetGlow)"/>';
    html += '<text x="' + centerX + '" y="' + (centerY + 24) + '" fill="rgba(255,215,0,0.8)" font-size="10" text-anchor="middle" font-family="monospace">太阳</text>';
    var infoHtml = '';
    for (var j = 0; j < planets.length; j++) {
        var p = planets[j];
        var pos = calcPlanetPos(p.key, now);
        var displayR = scaleAU(p.au);
        var px = centerX + displayR * Math.cos(pos.angle);
        var py = centerY + displayR * Math.sin(pos.angle);
        html += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="' + p.size + '" fill="' + p.color + '" filter="url(#planetGlow)"/>';
        html += '<text x="' + px.toFixed(1) + '" y="' + (py - p.size - 5).toFixed(1) + '" fill="' + p.color + '" font-size="9" text-anchor="middle" font-family="monospace" opacity="0.9">' + p.name + '</text>';
        infoHtml += '<div class="planet-info-item"><div class="planet-info-name" style="color:' + p.color + '">' + p.name + '</div><div class="planet-info-dist">' + pos.r.toFixed(2) + ' AU</div></div>';
    }
    html += '</svg>';
    html += '<div style="text-align:center;color:#556677;font-size:0.72rem;margin-top:8px;">计算时间: ' + now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN') + '</div>';
    var diagramEl = document.getElementById('planetDiagram');
    if (diagramEl) diagramEl.innerHTML = html;
    var infoEl = document.getElementById('planetInfoList');
    if (infoEl) infoEl.innerHTML = infoHtml;
}
function openImageLightbox(src) {
    var lightbox = document.getElementById('imageLightbox');
    var img = document.getElementById('lightboxImage');
    if (img) img.src = src;
    if (lightbox) lightbox.classList.add('show');
}
function closeImageLightbox() {
    var lightbox = document.getElementById('imageLightbox');
    if (lightbox) lightbox.classList.remove('show');
}
if (!window._spaceFeaturesInit) {
    window._spaceFeaturesInit = true;
    document.addEventListener('click', function(e) {
        if (e.target && e.target.classList && e.target.classList.contains('post-image')) {
            openImageLightbox(e.target.src);
        }
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            var lb = document.getElementById('imageLightbox');
            if (lb && lb.classList.contains('show')) closeImageLightbox();
            var sdm = document.getElementById('spaceDataModal');
            if (sdm && sdm.classList.contains('show')) closeSpaceDataModal();
        }
    });
}

</script>
