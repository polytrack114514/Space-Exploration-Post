<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索宇宙帖子</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
            --bg: #000000;
            --surface: rgba(20, 20, 25, 0.75);
            --surface-hover: rgba(30, 30, 38, 0.85);
            --text-primary: #f0f0f5;
            --text-secondary: #888899;
            --text-muted: #555566;
            --accent: #e8e8f0;
            --accent-hover: #ffffff;
            --border: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(255, 255, 255, 0.15);
            --danger: #ff5555;
            --gold: #ffd700;
            --gold-hover: #ffe44d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.imglt.com/20260803/0994543291ec65795e5eadac3a134b6f.jpg') center/cover no-repeat;
            z-index: 0;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        .header {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px 20px 30px;
        }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: var(--text-primary);
        }
        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 180px;
            max-width: 400px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s;
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box input:focus {
            border-color: var(--gold);
        }
        .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.6;
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            display: none;
        }
        .search-clear:hover {
            color: var(--text-primary);
        }
        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
                    }
        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.01em;
        }
        .tab:hover {
            color: var(--text-primary);
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        .tab .icon {
            margin-right: 6px;
        }
        .fab-post {
            padding: 12px 28px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fab-post:hover {
            background: var(--gold-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(255, 215, 0, 0.25);
        }
        .fab-post:active {
            transform: translateY(0);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.25s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal {
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 32px 32px;
            width: 90%;
            max-width: 480px;
            position: relative;
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .modal-close:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }
        .modal-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 28px;
            color: var(--text-primary);
        }
        .modal-input {
            width: 100%;
            padding: 14px 18px;
            background: #22222e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s;
            margin-bottom: 16px;
        }
        .modal-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }
        .modal-input::placeholder {
            color: var(--text-muted);
        }
        .modal-textarea {
            width: 100%;
            min-height: 140px;
            padding: 14px 18px;
            background: #22222e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            resize: vertical;
            transition: all 0.25s;
            line-height: 1.6;
        }
        .modal-textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }
        .modal-textarea::placeholder {
            color: var(--text-muted);
        }
        .modal-submit {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            margin-top: 20px;
        }
        .modal-submit:hover {
            background: var(--gold-hover);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
        }
        .modal-submit:active {
            transform: scale(0.98);
        }
        .modal-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease;
                    }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 10px;
        }
        .post-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            border: 1px solid var(--border);
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .author-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }
        .post-time {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .post-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .post-content {
            color: rgba(240, 240, 245, 0.85);
            line-height: 1.75;
            font-size: 0.95rem;
            margin-bottom: 18px;
            white-space: pre-wrap;
            word-break: break-word;
            font-weight: 400;
        }
        .post-source {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 14px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }
        .source-label {
            color: var(--text-muted);
            white-space: nowrap;
        }
        .source-link {
            color: #4fc3f7;
            text-decoration: none;
            word-break: break-all;
            transition: color 0.2s;
        }
        .source-link:hover {
            color: #81d4fa;
            text-decoration: underline;
        }
        .pin-btn {
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: rgba(255, 215, 0, 0.8);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
            margin-right: 4px;
        }
        .post-card:hover .pin-btn {
            opacity: 1;
        }
        .pin-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.6);
            color: #ffd700;
        }
        .post-card:has(.pinned) {
            border-color: rgba(255, 215, 0, 0.3);
        }
        /* 登录区域 */
        .auth-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
        }
        .auth-user {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-primary);
                    }
        .auth-avatar-small {
            width: 24px; height: 24px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }
        .auth-name {
            font-weight: 500; max-width: 120px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .btn-logout {
            padding: 4px 10px; background: transparent; border: none;
            color: var(--text-muted); font-size: 0.75rem;
            cursor: pointer; font-family: inherit;
        }
        .btn-logout:hover { color: var(--danger); }
        .btn-auth {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s;
                    }
        .btn-auth:hover {
            color: var(--text-primary);
            border-color: var(--border-focus);
        }
        /* 登录弹窗 */
        .auth-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 150;
            display: none; align-items: center; justify-content: center;
        }
        .auth-modal-overlay.show { display: flex; }
        .auth-modal {
            background: #0f0f0f; border-radius: 20px;
            padding: 36px; width: 90%; max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }
        .auth-modal h2 {
            font-size: 1.3rem; margin-bottom: 24px;
            text-align: center; color: var(--text-primary);
        }
        .auth-field { margin-bottom: 16px; }
        .auth-field label {
            display: block; font-size: 0.82rem;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .auth-field input {
            width: 100%; padding: 12px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem; font-family: inherit; outline: none;
        }
        .auth-field input:focus { border-color: var(--border-focus); }
        .auth-field input::placeholder { color: var(--text-muted); }
        .auth-submit {
            width: 100%; padding: 12px;
            background: #ffffff; color: #000000;
            border: none; border-radius: 12px;
            font-size: 0.92rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s; margin-top: 8px;
        }
        .auth-submit:hover { background: #e0e0e0; }
        .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-switch {
            text-align: center; margin-top: 16px;
            font-size: 0.82rem; color: var(--text-muted);
        }
        .auth-switch a {
            color: var(--gold); cursor: pointer; text-decoration: none;
        }
        .auth-switch a:hover { text-decoration: underline; }
        .auth-error {
            background: rgba(255,85,85,0.1);
            border: 1px solid rgba(255,85,85,0.2);
            border-radius: 10px; padding: 10px 14px;
            color: #ff8888; font-size: 0.82rem;
            margin-bottom: 16px; display: none;
        }
        .auth-error.show { display: block; }
        .auth-success {
            background: rgba(100,255,100,0.1);
            border: 1px solid rgba(100,255,100,0.2);
            border-radius: 10px; padding: 10px 14px;
            color: #88ff88; font-size: 0.82rem;
            margin-bottom: 16px; display: none;
        }
        .auth-success.show { display: block; }
        .auth-close {
            position: absolute; top: 12px; right: 16px;
            background: transparent; border: none;
            color: var(--text-muted); font-size: 1.2rem; cursor: pointer;
        }
        /* 图片上传 */
        .image-input-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
        }
        .image-input {
            flex: 1; padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.88rem; font-family: inherit; outline: none;
        }
        .image-input:focus { border-color: var(--border-focus); }
        .image-input::placeholder { color: var(--text-muted); }
        .post-images {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
        }
        .post-image {
            max-width: 100%; max-height: 300px;
            border-radius: 12px; border: 1px solid var(--border);
            object-fit: cover;
        }
        /* 分享按钮 */
        /* 烟花 */
        @media (max-width: 600px) {
            .pin-btn {
                opacity: 1;
            }
        }
        .delete-btn {
            background: transparent;
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: rgba(255, 120, 120, 0.7);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .post-card:hover .delete-btn {
            opacity: 1;
        }
        .delete-btn:hover {
            background: rgba(255, 80, 80, 0.15);
            border-color: rgba(255, 100, 100, 0.6);
            color: rgba(255, 150, 150, 1);
        }

                    launches = data;

                const { error } = await sb.from('posts').update({
                    likes: post.likes || 0,

                    source_url: post.source_url || ''

                });

        async function togglePin(postId) {

        async function deletePost(postId) {

                alert('密码错误，无法删除！');

            }

        async function submitComment(postId) {
            const nameInput = document.getElementById('comment-name-' + postId);
            const textInput = document.getElementById('comment-text-' + postId);
            const name = nameInput.value.trim();
            const content = textInput.value.trim();

                nameInput.focus();
                return;

                textInput.focus();
                return;

            const post = posts.find(p => String(p.id) === String(postId));

            if (!post.comments) post.comments = [];

                content: content,
                time: Date.now()
            });
            nameInput.value = '';
            textInput.value = '';

            // 重新展开评论区

        // ==================== 工具函数 ====================
        function formatTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const minute = 60 * 1000;
            const hour = 60 * minute;
            const day = 24 * hour;
            if (diff < minute) return '刚刚';
            if (diff < hour) return Math.floor(diff / minute) + '分钟前';
            if (diff < day) return Math.floor(diff / hour) + '小时前';
            if (diff < 7 * day) return Math.floor(diff / day) + '天前';
            return new Date(timestamp).toLocaleDateString('zh-CN');
        }

        async function handleAuth() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            const confirm = document.getElementById('authConfirm').value;
            const errEl = document.getElementById('authError');
            const sucEl = document.getElementById('authSuccess');
            const btn = document.getElementById('authSubmitBtn');
            errEl.classList.remove('show');
            sucEl.classList.remove('show');
            if (!username) { showAuthErr('请输入用户名'); return; }
            if (!password || password.length < 6) { showAuthErr('密码至少6位'); return; }
            btn.disabled = true;
            btn.textContent = '请稍候...';
            await loadUsers();
            if (authMode === 'signup') {
                if (password !== confirm) { showAuthErr('两次密码不一致'); btn.disabled = false; btn.textContent = '注册'; return; }
                const exists = allUsers.find(u => u.name.toLowerCase() === username.toLowerCase());
                if (exists) { showAuthErr('该用户名已被注册'); btn.disabled = false; btn.textContent = '注册'; return; }
                const newUser = { name: username, password: password, avatar: getAvatar(username) };
                allUsers.push(newUser);
                await saveUser(newUser);
                showAuthSuc('注册成功！请登录');
                authMode = 'login';
                updateAuthUI();
                document.getElementById('authPassword').value = '';
                document.getElementById('authConfirm').value = '';
            } else {
                const user = allUsers.find(u => u.name.toLowerCase() === username.toLowerCase());
                if (!user || user.password !== password) { showAuthErr('用户名或密码错误'); btn.disabled = false; btn.textContent = '登录'; return; }
                currentUser = { name: user.name, avatar: user.avatar };
                localStorage.setItem('space_user', JSON.stringify(currentUser));

                renderAuthArea();

            btn.textContent = authMode === 'login' ? '登录' : '注册';

            // 分离即将发射和已发射

            const launched = [];
            launches.forEach((l, i) => {
                if (l.status === 'tbd') {
                    // TBD 发射始终留在"近期发射"
                    upcoming.push({ data: l, origIndex: i });
                } else if (l.date - now <= 0) {
                    launched.push({ data: l, origIndex: i });
                } else {
                    upcoming.push({ data: l, origIndex: i });
                }
            });
            // 已发射按时间倒序，只保留前20个
            launched.sort((a, b) => b.data.date - a.data.date);
            if (launched.length > 15) {
                const toRemove = launched.slice(20);
                for (const item of toRemove) {
                    if (item.data.id) {
                        sb.from('launches').delete().eq('id', item.data.id).then(() => {}).catch(e => console.error('删除旧发射记录失败:', e));

                    else agoStr = `${agoMins}分钟前`;
                    return `
                        <div class="launch-card launched-card">
                            <div class="launch-card-top">
                                <div class="launch-info">
                                    <div class="launch-rocket">${l.rocket}</div>
                                    <div class="launch-agency">${l.agency}</div>
                                    <div class="launch-meta">
                                        <span>📅 ${dateStr}</span>
                                        <span>📍 ${l.location}</span>
                                        <span>🎯 ${l.mission}</span>
                                    </div>
                                </div>
                                <span class="launch-badge badge-launched">已发射</span>
                            </div>
                            <div class="launched-time">🚀 发射于 <strong>${agoStr}</strong></div>
                            ${l.image ? `<img src="${escapeHtml(l.image)}" class="launch-image" alt="发射图片" onerror="this.style.display='none'">` : ''}
                            <div class="launch-desc">${escapeHtml(l.description)}</div>
                            ${currentUser && isOfficialUser(currentUser.name) ? `
                            <div class="launch-card-actions">
                                <button class="launch-edit-btn" onclick="editLaunch(${i})">✏️ 编辑</button>
                                <button class="launch-delete-btn" onclick="deleteLaunch(${i})">🗑 删除</button>
                            </div>
                            ` : ''}
                        </div>
                    `;
                }).join('') : '<div class="empty-state"><div class="emoji">🏁</div><p>暂无已发射的火箭</p></div>';
            }
        }
        // Tab 切换
        function updateLaunchTabs() {
            document.querySelectorAll('.launch-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.launchTab === currentLaunchTab);
            });
            const list = document.getElementById('launchList');
            const launchedList = document.getElementById('launchedList');
            if (list) list.style.display = currentLaunchTab === 'upcoming' ? '' : 'none';
            if (launchedList) launchedList.style.display = currentLaunchTab === 'launched' ? '' : 'none';
        }
        document.querySelectorAll('.launch-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentLaunchTab = tab.dataset.launchTab;
                updateLaunchTabs();
            });
        });
        function updateCountdowns() {
            const now = Date.now();
            let needRerender = false;
            launches.forEach((l, i) => {
                if (l.status === 'tbd') return; // 跳过TBD发射
                const diff = l.date - now;
                if (diff <= 0) {
                    needRerender = true;
                    return;
                }
                const days = Math.floor(diff / (24 * 60 * 60 * 1000));
                const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                const mins = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
                const secs = Math.floor((diff % (60 * 1000)) / 1000);
                const dEl = document.getElementById('cd-days-' + i);
                const hEl = document.getElementById('cd-hours-' + i);
                const mEl = document.getElementById('cd-mins-' + i);
                const sEl = document.getElementById('cd-secs-' + i);
                if (dEl) dEl.textContent = days;
                if (hEl) hEl.textContent = String(hours).padStart(2, '0');
                if (mEl) mEl.textContent = String(mins).padStart(2, '0');
                if (sEl) sEl.textContent = String(secs).padStart(2, '0');
            });
            if (needRerender) renderLaunches();
        }
        // ==================== 发射管理控件 ====================
        function renderLaunchControls() {
            const wrap = document.getElementById('launchControlsWrap');
            if (!wrap) return;
            wrap.innerHTML = '';
            if (currentUser && isOfficialUser(currentUser.name)) {
                wrap.innerHTML = '<button class="btn-add-launch" onclick="openLaunchEditor()">+ 添加发射</button>';
            }
        }
        // ==================== 发射编辑器 ====================
        let editingLaunchId = null;
        // ==================== 发射日期待确定开关 ====================
        function toggleLaunchDateTBD(checked) {
            const dateInput = document.getElementById('launchDate');
            dateInput.disabled = checked;
            if (checked) {
                dateInput.value = '';
            }
        }
        function openLaunchEditor() {
            editingLaunchId = null;
            document.getElementById('launchRocket').value = '';
            document.getElementById('launchAgency').value = '';
            document.getElementById('launchDate').value = '';
            document.getElementById('launchDateTBD').checked = false;
            document.getElementById('launchDate').disabled = false;
            document.getElementById('launchLocation').value = '';
            document.getElementById('launchMission').value = '';
            document.getElementById('launchImage').value = '';
            document.getElementById('launchDesc').value = '';
            document.getElementById('launchModalTitle').textContent = '添加火箭发射';
            document.getElementById('launchModalOverlay').classList.add('show');
            setTimeout(() => document.getElementById('launchRocket').focus(), 100);
        }
        function closeLaunchEditor() {
            document.getElementById('launchModalOverlay').classList.remove('show');
            editingLaunchId = null;
        }
        function editLaunch(index) {
            const l = launches[index];
            if (!l) return;
            editingLaunchId = index;
            // 检查是否为TBD（发射日期待确定）
            const isEditTBD = l.status === 'tbd';
            document.getElementById('launchDateTBD').checked = isEditTBD;
            document.getElementById('launchDate').disabled = isEditTBD;
            // 转换时间为 datetime-local 格式
            if (isEditTBD) {
                document.getElementById('launchDate').value = '';
            } else {
                const d = new Date(l.date);
                const localISO = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                document.getElementById('launchDate').value = localISO;
            }
            document.getElementById('launchRocket').value = l.rocket || '';
            document.getElementById('launchAgency').value = l.agency || '';
            document.getElementById('launchLocation').value = l.location || '';
            document.getElementById('launchMission').value = l.mission || '';
            document.getElementById('launchImage').value = l.image || '';
            document.getElementById('launchDesc').value = l.description || '';
            document.getElementById('launchModalTitle').textContent = '编辑火箭发射';
            document.getElementById('launchModalOverlay').classList.add('show');
        }
        async function submitLaunch() {
            if (!currentUser || !isOfficialUser(currentUser.name)) {
                alert('只有官方机构账号才能管理发射时间表');
                return;
            }
            const rocket = document.getElementById('launchRocket').value.trim();
            const agency = document.getElementById('launchAgency').value.trim();
            const dateStr = document.getElementById('launchDate').value;
            const location = document.getElementById('launchLocation').value.trim();
            const mission = document.getElementById('launchMission').value.trim();
            const image = document.getElementById('launchImage').value.trim();
            const desc = document.getElementById('launchDesc').value.trim();
            const isTBD = document.getElementById('launchDateTBD').checked;
            if (!rocket) { document.getElementById('launchRocket').focus(); return; }
            if (!isTBD && !dateStr) { document.getElementById('launchDate').focus(); return; }
            const btn = document.getElementById('launchSubmitBtn');
            btn.disabled = true;
            btn.textContent = '保存中...';
            const launchData = {
                rocket: rocket,
                agency: agency,
                date: isTBD ? null : new Date(dateStr).getTime(),
                location: location,
                mission: mission,
                image: image,
                description: desc,
                status: isTBD ? 'tbd' : 'tentative'
            };
            if (editingLaunchId !== null) {
                // 更新现有发射记录
                const existing = launches[editingLaunchId];
                const dbId = existing.id;
                const { error } = await sb.from('launches').update({
                    rocket: rocket, agency: agency, date: isTBD ? null : launchData.date,
                    location: location, mission: mission, image: image,
                    description: desc, status: isTBD ? 'tbd' : 'tentative'
                }).eq('id', dbId);
                if (error) { alert('保存失败: ' + error.message); btn.disabled = false; btn.textContent = '保存'; return; }
                launches[editingLaunchId] = { ...launchData, id: dbId };
            } else {
                // 新增发射记录
                const { data: inserted, error } = await sb.from('launches').insert({
                    rocket: rocket, agency: agency, date: isTBD ? null : launchData.date,
                    location: location, mission: mission, image: image,
                    description: desc, status: isTBD ? 'tbd' : 'tentative'
                }).select();
                if (error) { alert('保存失败: ' + error.message); btn.disabled = false; btn.textContent = '保存'; return; }
                if (inserted && inserted[0]) launches.push(inserted[0]);
            }
            // 按日期排序（TBD排到最后）
            launches.sort((a, b) => {
                if (a.status === 'tbd' && b.status !== 'tbd') return 1;
                if (a.status !== 'tbd' && b.status === 'tbd') return -1;
                return (a.date || 0) - (b.date || 0);
            });
            renderLaunches();
            btn.disabled = false;
            btn.textContent = '保存';
            closeLaunchEditor();
        }
        async function deleteLaunch(index) {
            if (!currentUser || !isOfficialUser(currentUser.name)) return;
            if (!confirm('确定要删除这条发射信息吗？')) return;
            const launch = launches[index];
            if (launch && launch.id) {
                const { error } = await sb.from('launches').delete().eq('id', launch.id);
                if (error) { alert('删除失败: ' + error.message); return; }
            }
            launches.splice(index, 1);
            renderLaunches();
        }
        renderLaunches();
        renderLaunchControls();
        setInterval(updateCountdowns, 1000);
        // ==================== 主题切换 ====================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const btn = document.getElementById('themeToggle');
            if (current === 'light') {
                html.removeAttribute('data-theme');
                localStorage.setItem('space_theme', 'dark');
                if (btn) btn.textContent = '🌙';
            } else {
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('space_theme', 'light');
                if (btn) btn.textContent = '☀️';
            }
        }

        // ==================== 编辑帖子 ====================
        let editingPostId = null;

        function editPost(postId) {
            const post = posts.find(p => String(p.id) === String(postId));
            if (!post) return;
            editingPostId = postId;
            document.getElementById('modalTitleText').textContent = '编辑帖子';
            document.getElementById('modalName').value = post.author || '';
            document.getElementById('modalName').readOnly = true;
            document.getElementById('modalName').style.opacity = '0.6';
            document.getElementById('modalTitle').value = post.title || '';
            document.getElementById('modalContent').value = post.content || '';
            document.getElementById('modalImage').value = post.image || '';
            document.getElementById('modalSourceUrl').value = post.source_url || '';
            document.getElementById('submitBtn').textContent = '保存';
            document.getElementById('modalOverlay').classList.add('show');
        }

        // ==================== 用户关注系统 ====================
        function toggleFollow(username) {
            let followed = JSON.parse(localStorage.getItem('space_follows')) || [];
            if (followed.includes(username)) {
                followed = followed.filter(function(u) { return u !== username; });
            } else {
                followed.push(username);
            }
            localStorage.setItem('space_follows', JSON.stringify(followed));
            // Sync to Supabase users table
            if (currentUser) {
                sb.from('users').update({ follows: JSON.stringify(followed) }).eq('name', currentUser.name)
                    .then(function() { loadUsers(); })
                    .catch(function(e) { console.error('sync follows failed:', e); });
            }
            const profileModal = document.getElementById('profileModal');
            if (profileModal && profileModal.classList.contains('show') && profileModal.dataset.username === username) {
                showUserProfile(username);
            }
            if (currentTab === 'follow') renderPosts();
        }

        // ==================== 用户资料 ====================
        function showUserProfile(username) {
            const modal = document.getElementById('profileModal');
            const contentDiv = document.getElementById('profileContent');
            if (!modal || !contentDiv) return;
            modal.dataset.username = username;
            const userPosts = posts.filter(function(p) { return p.author === username; });
            const totalLikes = userPosts.reduce(function(sum, p) { return sum + (p.likes || 0); }, 0);
            const avatar = getAvatar(username);
            const avHtml = avatar.startsWith('http') ? '<img src="' + avatar + '" alt="avatar">' : avatar;
            const badge = OFFICIAL_USERS[username] ? '<span class="badge-official">' + OFFICIAL_USERS[username].badge + '</span>' : '';
            const followed = JSON.parse(localStorage.getItem('space_follows')) || [];
            const isFollowing = followed.includes(username);
            // Calculate following and followers counts from allUsers
            var followingCount = 0;
            var followersCount = 0;
            for (var i = 0; i < allUsers.length; i++) {
                var u = allUsers[i];
                var uFollows = [];
                try { uFollows = JSON.parse(u.follows || '[]'); } catch(e) { uFollows = []; }
                if (u.name === username) followingCount = uFollows.length;
                if (uFollows.includes(username)) followersCount++;
            }
            // Also check localStorage for current user's follows
            if (currentUser && currentUser.name === username) {
                followingCount = followed.length;
            }
            var followBtnHtml = '';
            if (currentUser && currentUser.name !== username) {
                followBtnHtml = '<button class="profile-follow-btn ' + (isFollowing ? 'following' : 'follow') + '" id="profileFollowBtn" data-username="' + escapeHtml(username) + '" onclick="toggleFollow(this.dataset.username)">' + (isFollowing ? '✓ 已关注' : '+ 关注') + '</button>';
            }
            var postsHtml = '';
            if (userPosts.length > 0) {
                postsHtml = '<div class="profile-posts"><div class="profile-posts-title">TA的帖子 (' + userPosts.length + ')</div>';
                userPosts.forEach(function(post) {
                    var isLiked = likedPosts[post.id] || false;
                    postsHtml += '<div class="post-card" data-id="' + post.id + '">';
                    postsHtml += '<div class="post-header"><div class="post-author">';
                    postsHtml += '<div class="avatar">' + (post.avatar && post.avatar.startsWith('http') ? '<img src="' + post.avatar + '" alt="avatar">' : (post.avatar || '🌟')) + '</div>';
                    postsHtml += '<div class="author-info"><span class="author-name">' + escapeHtml(post.author) + '</span>';
                    postsHtml += '<span class="post-time">' + formatTime(post.time) + '</span></div></div></div>';
                    if (post.title) postsHtml += '<div class="post-title">' + escapeHtml(post.title) + '</div>';
                    if (post.image) postsHtml += "<div class='post-images'><img src='" + escapeHtml(post.image) + "' class='post-image' alt='图片'></div>";
                    if (post.content) postsHtml += '<div class="post-content">' + escapeHtml(post.content) + '</div>';
                    postsHtml += '<div class="post-footer"><button class="action-btn ' + (isLiked ? 'liked' : '') + '" onclick="toggleLike(\'' + post.id + '\')"><span>' + (isLiked ? '❤️' : '🤍') + '</span><span>' + (post.likes || 0) + '</span></button></div>';
                    postsHtml += '</div>';
                });
                postsHtml += '</div>';
            } else {
                postsHtml = '<div class="profile-posts"><div class="profile-posts-title">暂无帖子</div></div>';
            }
            contentDiv.innerHTML = '<div class="profile-header"><div class="profile-avatar-large">' + avHtml + '</div><div class="profile-info"><div class="profile-name">' + escapeHtml(username) + ' ' + badge + '</div><div class="profile-stats"><div class="profile-stat"><span class="profile-stat-num">' + userPosts.length + '</span><span>帖子</span></div><div class="profile-stat"><span class="profile-stat-num">' + followingCount + '</span><span>关注</span></div><div class="profile-stat"><span class="profile-stat-num">' + followersCount + '</span><span>粉丝</span></div><div class="profile-stat"><span class="profile-stat-num">' + totalLikes + '</span><span>获赞</span></div></div></div>' + followBtnHtml + '</div>' + postsHtml;
            modal.classList.add('show');
        }

        function closeProfileModal() {
            const modal = document.getElementById('profileModal');
            if (modal) modal.classList.remove('show');
        }

// ==================== 初始化 ====================
        // launchModalOverlay 在 script 之后渲染，这里绑定事件
        var lmo = document.getElementById('launchModalOverlay');
        if (lmo) lmo.addEventListener('click', function(e) {
            if (e.target === this) closeLaunchEditor();
        });
        // 主题初始化
        const savedTheme = localStorage.getItem('space_theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            const themeBtn = document.getElementById('themeToggle');
            if (themeBtn) themeBtn.textContent = '☀️';
        }
        // 用户资料弹窗点击关闭
        var pmo = document.getElementById('profileModal');
        if (pmo) pmo.addEventListener('click', function(e) {
            if (e.target === this) closeProfileModal();
        });
        renderAuthArea();
        loadUsers();
        loadPosts();
</script>
</body>
